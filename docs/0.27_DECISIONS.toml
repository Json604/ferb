summary = "Send to developer: under an answer FERB recorded as ending badly (its root task failed or was interrupted, or its request has a chat.failed row), the notch's button asks reports.build for one text file (~/.ferb/reports, folder 0700, file 0600, reports kept 30 days; a summary, the request and FERB's answer, the full trace as `ferb trace TASK --full` renders it, and FERB's recorded problems; every part redacted, sealed values in their escaped forms too) and opens a new email in the owner's own Mail to `[feedback] address` (default ktky.attri@gmail.com) with the file attached; FERB sends nothing. Without a Mail account the file is shown in Finder with the address to send it to."

