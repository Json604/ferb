[package]
name = "ferb-orchestrator"
version = "0.28.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.100"
publish = false
description = "Orchestration's building blocks (ferb/orchestrator except supervisor.py and worker.py, and ferb/decide): plans and their checks, plan state and the plan runner, parts, loops, steering, continuity, delegated conversations, evidence, literal checks, cards, notices, answer marks, the reply stream, progress lines, the action ledger and the answer models with pydantic's validation and error text"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[features]
default = ["store"]
# The parts that read and write the Mac's SQLite store (plan state, ledger, continuity, conversations, loop state,
# cards, evidence, notices, episodes, test runs, Jev's decision record). Without it the crate is the portable part:
# the answer models, plan checks, parts, loops' pacing, steering's words, answer marks, the reply stream, progress.
store = ["dep:ferb-store", "dep:rusqlite", "dep:futures-util"]

[dependencies]
ferb-context = { path = "../ferb-context" }
ferb-core = { path = "../ferb-core" }
ferb-fs = { path = "../ferb-fs" }
ferb-py = { path = "../ferb-py" }
ferb-sanitize = { path = "../ferb-sanitize" }
ferb-store = { path = "../ferb-store", optional = true }
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
fancy-regex = "0.14.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
indexmap = "2.14"
libc = "0.2.191"
regex = "1.13"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
# The policy part's words and keys, to answer the `Policy` seam in the replay tests as the Python build does.
ferb-policy = { path = "../ferb-policy" }
tempfile = "3.20.0"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros", "test-util"] }
