[package]
name = "ferbd"
version = "0.28.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.100"
publish = false
description = "FERB's daemon program: composes the engine crates (ferb/daemon/main.py), serves the RPC socket, and is re-entered as the models' tool bridge and FERB.app's internal commands"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferbd"
path = "src/main.rs"

# FERB.app's Contents/Resources/bin/ferb: the internal commands and the toolbox, without the agent's modes
# (src/host.rs); scripts/build-app-rust.sh
[[bin]]
name = "ferb"
path = "src/bin/ferb.rs"

[features]
default = []
# Test-only: the binary honors FERBD_STAND_INS (the ferb-daemon test suite's stand-ins, a fake clock and ids, and a
# control socket). A build without this feature has no such code at all: the variable is never read.
stand-ins = []

[dependencies]
ferb-browser = { path = "../ferb-browser" }
# the planner, with its seams into the daemon's areas (feature `daemon`): src/compose/supervisor.rs
ferb-supervisor = { path = "../ferb-supervisor", features = ["daemon"] }
ferb-clock = { path = "../ferb-clock" }
ferb-context = { path = "../ferb-context" }
ferb-core = { path = "../ferb-core" }
ferb-daemon = { path = "../ferb-daemon" }
ferb-device = { path = "../ferb-device" }
ferb-fs = { path = "../ferb-fs" }
ferb-gateway = { path = "../ferb-gateway" }
ferb-identity = { path = "../ferb-identity" }
ferb-learning = { path = "../ferb-learning" }
ferb-mac-hands = { path = "../ferb-mac-hands" }
ferb-memory = { path = "../ferb-memory" }
ferb-orchestrator = { path = "../ferb-orchestrator" }
ferb-platform-macos = { path = "../ferb-platform-macos" }
ferb-policy = { path = "../ferb-policy" }
ferb-py = { path = "../ferb-py" }
ferb-rpc = { path = "../ferb-rpc" }
ferb-runtimes = { path = "../ferb-runtimes" }
ferb-sanitize = { path = "../ferb-sanitize" }
ferb-sense = { path = "../ferb-sense" }
ferb-shell = { path = "../ferb-shell" }
ferb-store = { path = "../ferb-store" }
ferb-trace = { path = "../ferb-trace" }
ferb-worker = { path = "../ferb-worker" }
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
libc = "0.2.191"
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal", "process", "fs"] }
sha2 = "0.10.9"
zeroize = "1"
hex = "0.4"
base64 = "0.22"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# fs.look's decoders (ImageIO, PDFKit, CoreGraphics) and the pasteboard's change count: src/native.rs
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
# the disturbance sentinel's Space observer (src/compose/desktop.rs)
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-image-io = "0.3.2"
objc2-app-kit = "0.3.2"

[dev-dependencies]
tempfile = "3.20.0"
hex = "0.4"
# The test build's binary honors FERBD_STAND_INS (cargo unifies a dev-dependency's features into what the tests
# build); `cargo build` and a release build never enable it.
ferbd = { path = ".", features = ["stand-ins"] }
