[package]
name = "ferb-device"
version = "0.28.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.100"
publish = false
description = "FERB's device setup (ferb/device: the service definition, native-messaging hosts, uninstall, device profile) and the internal commands FERB.app runs plus the developer toolbox (ferb/cli)"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
ferb-core = { path = "../ferb-core" }
ferb-py = { path = "../ferb-py" }
ferb-rpc = { path = "../ferb-rpc" }
ferb-sanitize = { path = "../ferb-sanitize" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
plist = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
