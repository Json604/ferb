[package]
name = "ferb-learning"
version = "0.28.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.100"
publish = false
description = "Memory items, the core profile, learned nodes, daily distill, playbooks, the Mac profile and the import job"

[features]
default = ["store"]
# Everything that reads and writes the Mac's SQLite store. Without it the crate is the portable part only: the word
# and clause rules, lineage, how-notes and search text, the journal's origins, the model-call wrapper.
store = ["dep:rusqlite", "dep:ferb-store", "ferb-memory/store"]

[dependencies]
ferb-context = { path = "../ferb-context" }
ferb-core = { path = "../ferb-core" }
ferb-memory = { path = "../ferb-memory", default-features = false }
ferb-py = { path = "../ferb-py" }
ferb-sanitize = { path = "../ferb-sanitize" }
# The runtime interface every caller shares (`ModelRuntime`): `calls::Made::from_model`.
ferb-worker = { path = "../ferb-worker" }
ferb-orchestrator = { path = "../ferb-orchestrator", default-features = false }
ferb-store = { path = "../ferb-store", optional = true }
# The same version ferb-store names (the workspace's), so one bundled SQLite is linked.
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
