[workspace]
resolver = "2"
# A crate joins `members` when the coordinator has verified it; a crate still being ported sits in `exclude` and is
# built on its own (`cargo ... --manifest-path crates/<name>/Cargo.toml`), so unfinished work never breaks the gate.
members = [
    "crates/ferb-py",
    "crates/ferb-core",
    "crates/ferb-sanitize",
    "crates/ferb-store",
    "crates/ferb-rpc",
    "crates/ferb-identity",
    "crates/ferb-platform-macos",
    "crates/ferb-native-host",
    "crates/ferbd",
    "crates/ferb-context",
    "crates/ferb-fs",
    "crates/ferb-clock",
    "crates/ferb-shell",
    "crates/ferb-memory",
    "crates/ferb-runtimes",
    "crates/ferb-policy",
    "crates/ferb-trace",
]
exclude = [
    "crates/ferb-gateway",
    "crates/ferb-sense",
    "crates/ferb-device",
    "crates/ferb-orchestrator",
    "crates/ferb-mac-hands",
    "crates/ferb-learning",
    "crates/ferb-browser",
]

[workspace.package]
version = "0.28.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.100"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a float read from JSON is the one Python reads (recorded costs, timings); without it the last
# digit can be off.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
fancy-regex = "0.14"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
libc = "0.2"
tempfile = "3"
getrandom = "0.3"
socket2 = "0.6"
plist = { version = "1", default-features = false }
toml_edit = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
zeroize = "1"
aes-gcm = "0.10"
hkdf = "0.12"
roxmltree = "0.20"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
