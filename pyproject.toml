[project]
name = "ferb"
version = "0.26.1"
description = "FERB: personal agent runtime for macOS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.160",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "idna==3.20",
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "prompt-toolkit>=3.0.47",
    "pydantic>=2,<3",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-fsevents>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-screencapturekit>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "tiktoken>=0.12,<1",
    "tomlkit>=0.15.1",
]

[project.optional-dependencies]
memory = ["mlx-embeddings==0.1.0", "sqlite-vec==0.1.9"]

[project.scripts]
ferb = "ferb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferb"]

[tool.hatch.build.targets.wheel.force-include]
"extensions/chromium" = "ferb/_extension"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real and not real_claude and not real_api'"
markers = ["real: real models / browsers / Mac (Codex only); run with -m real",
           "real_claude: the Claude-runtime variants of real tests; only when the owner runs -m real_claude",
           "real_api: the direct-API runtime variants of real tests (billed per token); only when the owner runs -m real_api"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "ferb.core.*"
strict = true
