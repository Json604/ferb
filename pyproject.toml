[project]
name = "ferb"
version = "0.1.0"
description = "FERB: personal agent runtime for macOS"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
ferb = "ferb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "ferb.core.*"
strict = true
