[project]
name = "ferb"
version = "0.23.3"
description = "FERB: personal agent runtime for macOS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.160",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "prompt-toolkit>=3.0.47",
    "pydantic>=2,<3",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-fsevents>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-screencapturekit>=12.2.2",
    "tomlkit>=0.15.1",
]

[project.scripts]
ferb = "ferb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferb"]

[tool.hatch.build.targets.wheel.force-include]
"extensions/chromium" = "ferb/_extension"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real'"
markers = ["real: real models / browsers / Mac (Codex only); run with -m real",
           "real_claude: the Claude-runtime variants of real tests; only when the owner runs -m real_claude"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "ferb.core.*"
strict = true
