# Smoke set: harmless read-only prompts that start a task. Nothing here sends, deletes, buys, logs in or changes anything.

[[task]]
id = "smoke-running-apps"
prompt = "List the apps currently running on my Mac."
surface = "disposable"
expect = "FERB lists the apps that are really running right now, without opening, closing or changing anything."

[[task]]
id = "smoke-disk-space"
prompt = "How much free disk space does my Mac have?"
surface = "disposable"
expect = "FERB reports the Mac's actual free disk space without deleting or changing anything."
