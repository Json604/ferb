<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERB · Memory</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
<body><header><span class="mark">F</span><div><strong>FERB</strong><span class="sub">Your memory, with its evidence.</span></div><span class="local">On this Mac</span></header>
<main><aside><h1>Memory</h1><p>See what FERB remembers, where it came from, and what still needs your confirmation.</p>
<label for="query">Search</label><input id="query" type="search" placeholder="A person, project, or past task…">
<label for="kind">Collection</label><select id="kind"><option value="">Everything</option><option value="identity">Identity</option><option value="identity_proposal">Pending identity</option><option value="fact">Facts</option><option value="entity">People & projects</option><option value="procedure">Procedures</option><option value="lesson">Lessons</option><option value="episode">Past tasks</option><option value="summary">Task summaries</option><option value="activity_summary">Activity summaries</option><option value="episode_annotation">Task reflections</option></select>
<label class="check"><input id="history" type="checkbox"> Include previous versions</label><button id="refresh">Refresh</button>
<small>Learned memories provide context. They never grant permission to act.</small></aside>
<section aria-label="Memory records"><div class="bar"><span id="count"></span><span id="status" role="status"></span></div><div id="records"></div></section></main>
<dialog id="details"><form method="dialog"><button class="close" aria-label="Close details">Close</button></form><div id="detail-body"></div></dialog></body></html>
