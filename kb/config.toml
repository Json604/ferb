# repo-kb settings (tools/kb/kb.py). Every key is optional; the defaults are in kb.py DEFAULT_CONFIG.
[kb]
# Turn on once the tests are linked (migration step "link tests"): every active decision then needs a test that
# carries `decision: ID`, a `live` check, or an `untestable` reason.
coverage = true
# Every tracked file must belong to exactly one area in kb/areas.toml, except these.
ownership = true
# ownership_ignore = [".gitignore", "README*", "LICENSE*", "docs/**"]
# test_globs = ["tests/**", "**/*_test.go"]
# Generate .claude/rules/kb-<area>.md (path-scoped rules that Claude Code loads when it touches the area's files).
claude_rules = true

[kb.limits]
# Field length caps, in characters. They are what keeps records from growing into essays.
# rule = 600
