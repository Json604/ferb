# repo-kb settings (tools/kb/kb.py). Every key is optional; the defaults are in kb.py DEFAULT_CONFIG.
[kb]
# Turn on once the tests are linked (migration step "link tests"): every active decision then needs a test that
# carries `decision: ID`, a `live` check, or an `untestable` reason.
coverage = true
# Every tracked file must belong to exactly one area in kb/areas.toml, except these.
ownership = true
# ownership_ignore = [".gitignore", "README*", "LICENSE*", "docs/**"]
# test_globs = ["tests/**", "**/*_test.go"]
# Generate .claude/rules/kb-<area>.md (path-scoped rules that Claude Code loads when it touches the area's files).
claude_rules = true

# The Python daemon's files, removed by ENG-11/ENG-16: records that name them are read at the last commit that had
# them (PROJ-509).
historical = [{commit = "9d3f84bc1258a824ddcc43e50e8653fdc5f68c96", paths = ["ferb", "tests", "pyproject.toml", "uv.lock", ".python-version", "scripts/build-app.sh", "scripts/codex_standin.py", "scripts/question_run.py", "scripts/question_compare.py", "rust/crates/ferbd/tests/python_client.rs", "rust/crates/ferb-rpc/tests/python_client.rs", "ui/mac/FERBAgent/main.c", "spikes"], why = "ENG-11: the Python daemon left the repo"}]

# Folders that moved (PROJ-510, 2026-11-16): a record keeps the path it was written with; one under `from` that names
# nothing tracked now is read at its place under `to`, before `historical` (PROJ-511). The longest `from` wins.
moved = [
    {from = "rust", to = "engine", why = "PROJ-510: the Rust engine's folder"},
    {from = "ferb", to = "engine/runtime", why = "PROJ-510: what the Python package left (runtime Markdown, migrations, the helper's source)"},
    {from = "ui", to = "apps", why = "PROJ-510: FERB.app in apps/mac; the phone apps beside it"},
    {from = "extensions/chromium", to = "extension", why = "PROJ-510: the unpacked browser extension"},
    {from = "extensions/store", to = "extension-store", why = "PROJ-512: the extension's store listing, kept out of the unpacked folder"},
]

[kb.limits]
# Field length caps, in characters. They are what keeps records from growing into essays.
# rule = 600
