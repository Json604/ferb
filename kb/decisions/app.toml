[APP-504]
title = "Intro motion rules"
by = "agent"
date = 2026-11-01
status = "active"
rule = "Springs with a perceptual duration of about 0.35-0.5 s: opening with a small bounce (0.15-0.3), closing and dismissal critically damped (bounce 0), morphs snappy. Every animation is interruptible and retargetable mid-flight, keeping its velocity. Decorative animations last at most 2 s and the user never waits on one. Content stays concentric with the notch; the notch and the orb split and merge as liquid (metaball). Reduce Motion: springs become cross-fades and the orb fades in beside its target instead of flying."
paths = ["ui/mac/FERBNotch/Sources/NotchCore/OrbMotion.swift", "ui/mac/FERBNotch/Sources/FERBNotch/OrbController.swift"]
legacy = "notes/setup-intro.md The direction (Motion) and Constraints (Reduce Motion)"

