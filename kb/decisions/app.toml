by = "owner"
date = 2026-11-01
status = "active"
words_source = "notes/setup-intro.md Goals, journey step 3 and Constraints (design agreed 2026-11-01): an agent's write-up; no verbatim quote"
rule = "Allow all starts a guided sequence. For a list pane FERB opens the exact pane and the orb docks beside System Settings holding a real draggable FERB icon, follows the window and hides when Settings isn't in front; a request-style permission gets one notch line, then the system prompt. A grant counts only when the system confirms it, with a real check where the API can be stale, polled about every 1.5 s, never inferred from a drop. A grant that needs a restart restarts that part without losing the tour's place."
why = "Nobody guesses their way through System Settings or is told of a grant the system doesn't confirm. Real checks: an AX read, another app's window title, IOHIDCheckAccess. macOS 27 calls Accessibility \"Device Control and Data Access\"."
rejected = ["Counting a grant because the drag completed"]
