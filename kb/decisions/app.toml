# Decisions of area `app` (kb/areas.toml). Moved from notes/daemon.md on 2026-11-02.

[APP-1]
title = "FERB's own email account is an optional setup step in the app"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/daemon.md owner decision 7 (owner confirmed the proposal): an agent's paraphrase; no verbatim quote recorded"
rule = "FERB.app's setup offers \"Give FERB its own Google account (recommended)\": the owner creates the account (creation needs human verification) and signs it into a browser profile; FERB finds and pairs it. If skipped, FERB browses as the owner in a profile the owner picks, and features that need FERB's own inbox say they aren't set up."
paths = ["ui/mac/FERBNotch", "ferb/daemon/settings.py::write_identity"]
legacy = "notes/daemon.md decision 7"

[APP-2]
title = "The app gains Restore, Delete saved secret/card and Uninstall"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/daemon.md owner decision 8: an agent's paraphrase of the owner's ruling; no verbatim quote recorded"
rule = "FERB.app has, functional only (the owner polishes the UI later): Restore, listing FERB's Trash moves, backup copies and snapshots and restoring one; Delete, removing a stored owner secret or card; Uninstall, removing FERB fully, Keychain items included. Daemon RPCs plus minimal app screens."
paths = ["ui/mac/FERBNotch", "ferb/identity/owner_secrets.py::OwnerSecrets.delete"]
legacy = "notes/daemon.md decision 8"

[APP-3]
title = "\"What FERB saw\": the screenshots FERB kept, per message and in Settings"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/daemon.md fix list (owner, 2026-10-31, step 12e): an agent's paraphrase; no verbatim quote recorded"
rule = "A button on each message in the notch opens the screenshot taken when it was sent and the images its task captured, each exactly as the model got it, with time and app or site. Settings → Data lists every saved screenshot of the last 7 days, newest first."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/SeenViewer.swift", "ferb/daemon/areas/about.py::About._seen_list"]
legacy = "notes/daemon.md fix list: \"What FERB saw\""

[APP-4]
title = "The app guide lives in NotchCore and reaches the daemon on each connection"
by = "agent"
date = 2026-10-31
status = "active"
rule = "FERB.app's how-tos, shortcuts and setting places are one list kept in NotchCore (AppGuide), beside the screens it names. FERB.app sends it with about.guide (APP_ONLY: only FERB.app's words become FERB's guide) on every connection; the daemon keeps it in memory and, until the app connects after a daemon start, the About document says so."
paths = ["ui/mac/FERBNotch/Sources/NotchCore/AppScreens.swift", "ferb/daemon/about.py"]
legacy = "notes/daemon.md Rulings (step 12c): the app guide"

[APP-5]
title = "Uninstall waits for the service to unregister"
by = "agent"
date = 2026-10-31
status = "active"
rule = "FERB.app's Uninstall (plain or delete everything) awaits SMAppService.unregister() and checks the status; only not-registered or not-found goes on to `ferb uninstall [--purge --yes]`. A throw or a service macOS still lists shows why in the output lines and nothing is uninstalled."
why = "A fire-and-forget unregister let the uninstall start while the service was still registered."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/SetupServices.swift"]
legacy = "notes/daemon.md Rulings (12e review): uninstall waits"

[APP-400]
title = "FERB.app's own executable answers the hearing modes"
by = "agent"
date = 2026-11-01
status = "active"
rule = "Before it starts the app, FERB.app's executable answers `transcribe`, `status` and `request-speech` with the old helper's arguments, answer files, lease and exit codes (no window, no microphone). The daemon runs it with `open -g -n -W --env FERB_HOME=… <FERB.app> --args <mode> …`. `request-speech` stays but setup no longer calls it. The home rule is NotchCore/FerbHomeRule.swift."
why = "It carries the owner's merge of FERB Voice into FERB.app (VOICE-403) without changing the daemon's hearing protocol."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/Hearing.swift", "ui/mac/FERBNotch/Sources/NotchCore/FerbHomeRule.swift"]
legacy = "notes/voice.md Rulings that carry the merge 1"

[APP-401]
title = "Setup's microphone row also asks for Speech Recognition"
by = "agent"
date = 2026-11-01
status = "active"
rule = "Setup has no separate hearing row: the microphone row covers Microphone and Speech Recognition (one grant for dictation and hearing); `ferb doctor` still probes hearing."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch"]
legacy = "notes/voice.md Rulings that carry the merge 3"

[APP-402]
title = "Send dictation on release is off by default; a dictated draft is answered aloud"
by = "agent"
date = 2026-10-31
status = "active"
rule = "Settings → General \"Send dictation when I let go of the keys\" (`voice.sendOnRelease`) is off by default. A sent draft that still holds the last dictated words goes with `speak: true`, so a dictated message lightly edited and sent with Return is still answered aloud; a typed message isn't."
why = "Sending on release changes when a message leaves, so the owner turns it on."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/SettingsPages.swift"]
legacy = "notes/voice.md Rulings (step 11) 7"

[APP-403]
title = "The work preview is always live while a task runs"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/preview.md owner decision 1 (\"Always live, as today\"): an agent's summary; no verbatim quote recorded"
rule = "The notch shows a live picture of what FERB is working on: the task's own browser tab or the one Mac app window the current call targets, never the whole screen. The work-row circles, the popover and the floating player stream while a task runs."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/TaskPreview.swift", "ferb/daemon/task_preview.py"]
legacy = "notes/preview.md decision 1"

[APP-404]
title = "When FERB leaves a window, the preview freezes on its last frame with what FERB is doing now"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/preview.md owner decision 2: an agent's summary (its quoted lines are example status texts, not the owner's words)"
rule = "When FERB stops working in a window (moves to another step, pauses, waits, asks), the preview freezes on FERB's last frame of it and shows what FERB is doing now over it (asking, waiting, working in another app, paused). It never keeps streaming the owner's window after FERB has left it."
why = "Before, it kept streaming: new WhatsApp messages would stream into the preview."
paths = ["ferb/daemon/task_preview.py::TaskPreviews", "ui/mac/FERBNotch/Sources/FERBNotch/TaskPreview.swift"]
legacy = "notes/preview.md decision 2"

[APP-405]
title = "Preview frame rate: measure first; the owner sets any cap from data"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/preview.md owner decision 3 (\"Frame rate: measure first\"): an agent's summary; no verbatim quote recorded"
rule = "There is no preview frame-rate cap until the heat is confirmed from data. Preview frames and capture time are counted (`resource_samples.work_json.preview`); step 13 measures the same task with the preview open vs closed, and the owner decides a cap from that."
why = "The 33-53% daemon CPU windows on 2026-10-30 came while previews ran, but the tasks differed, so it isn't proven."
paths = ["ferb/daemon/resources.py", "ferb/daemon/task_preview.py::Counts"]
legacy = "notes/preview.md decision 3"

[APP-406]
title = "Previews are hidden from screen sharing and recordings"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/preview.md owner decision 4: an agent's summary; no verbatim quote recorded"
rule = "The preview popovers and the floating player are excluded from screen sharing and screen recordings (`sharingType = .none`)."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/TaskActivityBubble.swift", "ui/mac/FERBNotch/Sources/FERBNotch/TaskPreview.swift"]
legacy = "notes/preview.md decision 4"

[APP-407]
title = "The preview captures only while someone can see it"
by = "agent"
date = 2026-10-31
status = "active"
rule = "Every preview loop pauses while the displays sleep, the screen is locked or another user's session is in front (`PreviewAccess`); each video view asks only while its window is visible (occlusion); the work-row circles only while the notch is open and not stepped aside. The frame rate itself is unchanged (APP-405)."
why = "APP-403 keeps it always live when visible; capturing for nobody only costs heat."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/TaskPreview.swift"]
legacy = "notes/preview.md fix list (step 8d): capture only while visible"

[APP-300]
title = "The notch gets the answers-in-steps mock's UI"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/orchestration.md owner decision 20: an agent's paraphrase of the owner's ruling; no verbatim quote recorded"
rule = "The notch shows the turn card with one row per part and its states (working spinner, done check, asks amber, couldn't-do red, updated tag, paused violet), the done/sites footer, questions with buttons inside a row, the plan-line bubble style and the typing-dots bubble; not the mock's dashed explanation labels or \"code\" chips. The UI work is functional; the owner polishes."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/TurnCardView.swift"]
legacy = "notes/orchestration.md decision 20"

[APP-301]
title = "The notch opens itself; a banner only when it can't show"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/orchestration.md owner decision 21: an agent's paraphrase of the owner's ruling; no verbatim quote recorded"
rule = "When a part needs the owner (a question or a Yes) and when the whole task finishes, the notch opens itself without taking keyboard focus or switching apps. Rows that fill quietly only update the card. A macOS banner is the fallback only when the notch can't show (a full-screen app or video covers it, the display is asleep, FERB.app is quit); tapping it opens the notch."
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/NotchModel.swift"]
legacy = "notes/orchestration.md decision 21"
