rule = "FERB.app keeps a tour version (IntroProgress.currentTour). An install whose last whole tour is older, or that never had one, plays the current tour once as a first run after its quiet update (the clip with the Dense entrance, every beat), keeping its data, sign-in and grants. Starting the whole tour records the version; an interrupted tour still resumes. Then as before: setup finished means no tour (Settings: Replay intro); missing grants get those beats plus Home; setup never finished gets the full tour. The version rises only on the owner's word."
why = "The owner asked how friends with an earlier version get the new demo, or the whole app as new; the agent's reading is the whole first run with nothing deleted. The owner's own Mac takes the same path."
