[APP-520]
title = "Sound is a designed system: one family from one seed"
by = "owner"
date = 2026-11-01
status = "active"
words_source = "notes/setup-intro.md Sound (\"Owner's words, condensed\") and notes/sound.md: an agent's condensation; no verbatim quote"
rule = "FERB has an original, recognisable family of sounds sharing one character, each meaning one thing and recognisable without looking. A sound logo (full, tour only) seeds short derived cues, quieter and shorter the more often they play; needs you is the loudest everyday cue. Every sound has a visual twin, so FERB is fully understandable with sound off. FERB honours \"Play user interface sound effects\" and the alert volume, and never plays music under the tour."
