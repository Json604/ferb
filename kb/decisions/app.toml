[APP-535]
title = "How the sound family is built"
by = "agent"
date = 2026-11-01
status = "active"
rule = "One material, one 5-note pitch set, one room and one mastering chain; children change only contour, rhythm and length, cut down from the sound logo rather than composed anew. Frequent sounds vary a little per play (a few variants picked at random); the sound logo never varies. No loop while listening or working. Files are rendered offline by demo/sound-family/render.py (48 kHz/24-bit, Standard and Subtle, a room IR) and bundled losslessly as ALAC .caf; render.py is the source of every sound's level and length."
why = "A loop would leak into the microphone and break \"calm once settled\". Earcon guidelines (Brewster) and logo-derived families (Antfood) keep cues recognisable together."
evidence = "2026-11-01: the Mac's premium cues (Glass.aiff, Siri jbl_*, payment_success) measured as 1-3 clean tuned partials, a strike gone within ~50 ms, clean decays, no noise; the first sine-and-whoosh placeholders were judged cheap."
paths = ["demo/sound-family/render.py", "ui/mac/FERBNotch/Sources/FERBNotch/Resources/Sounds", "ui/mac/FERBNotch/Sources/FERBNotch/FerbSoundFiles.swift"]
