[APP-500]
title = "First install is meeting FERB, not a setup wizard"
by = "owner"
date = 2026-11-01
status = "active"
words_source = "notes/setup-intro.md Intent (\"owner's words, condensed\"), Goals, Non-goals, Anti-goals: an agent's condensation; no verbatim quote"
rule = "First install is a short, interactive introduction that makes FERB feel like it belongs on the Mac: taught through small interactions, not slides, with the real notch central so setup feels like using the product; capable and warm, never cartoonish or theatrical. In one continuous tour a new user meets FERB, connects it, sees what it can do on their Mac, learns to control it and to bring it back, ending in the notch. The intro shows existing capabilities only; outside references are studied for principles, never their assets or flow."
why = "Inspiration: HeyClicky's intro (principles only), Apple's Dynamic Island motion, the macOS 27 Siri orb (one object that morphs, content grows out of it, calm once settled). AskForPermission and Scrawl (MIT) were studied for the drag card."
rejected = ["A wizard of screens with Next buttons", "A permission checklist dressed up", "A separate onboarding-app look that isn't the notch", "An account system, marketing screens or feature slides", "New FERB capabilities made for the intro"]
paths = ["ui/mac/FERBNotch/Sources/FERBNotch/IntroController.swift", "ui/mac/FERBNotch/Sources/NotchCore/IntroPlan.swift"]
live = ["LIVE-500"]
legacy = "notes/setup-intro.md Intent, Goals, Non-goals, Anti-goals"

