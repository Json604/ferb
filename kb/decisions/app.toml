date = 2026-11-01
status = "active"
rule = "Mono sources are placed from the notch's and the orb's frames: pan = clamp((x / screenWidth - 0.5) x 1.2, -0.6, 0.6), the notch at 0; distance from the notch lowers gain by at most 3 dB and adds a low-pass, never elevation or Doppler. HRTF (AVAudioEnvironmentNode) only when headphones are the output, equal-power pan otherwise. The engine stays warm and compensates output latency; no tight sync is promised on Bluetooth. Meaning never depends on position."
