rule = "FERB's everyday feedback sounds (summon, listening start and end, done, needs you, paused, error) ring about as long as macOS's Apple Pay success sound (1.41 s). As in APP-520: one original, recognisable family sharing one character, each sound meaning one thing and recognisable without looking; a sound logo (full, tour only) seeds the derived cues, quieter the more often they play; needs you is the loudest everyday cue. Every sound has a visual twin. FERB honours \"Play user interface sound effects\" and the alert volume, and never plays music under the tour."
why = "Agent's reading: a longer natural ring (render.py RING_*), never stretching, padding or more room, so pitch, attack and LUFS stay; Subtle keeps its 0.8x length; the Material notification has no ring to lengthen and keeps 0.8 s; the logo, first-launch clip and orb sounds are not feedback sounds."
evidence = "afinfo after render.py: Standard 1.29-1.35 s (was 0.32-1.11), Subtle 1.05-1.09 s; payment_success.aif is 1.41 s and falls 60 dB by 1.10 s, the new cues by about 1.25 s with the app's room."
