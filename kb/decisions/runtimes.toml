[RUN-421]
title = "Where each runtime's call timing comes from"
by = "agent"
date = 2026-11-04
status = "active"
rule = "Codex: a call begins at turn/start or a FERB tool's completion; its request goes out at its request trace line; its output is item starts, deltas and completions, timed when read, not when consumed; a usage report that follows a tool already run keeps the tool out of both calls. The direct-API loop: from its POST (a retry's wait counts as runtime_ms) through each streamed event; an unstreamed answer is one output. Claude Agent SDK: one usage per turn, so its timing covers the turn, tools included."
why = "Owner 2026-11-04 (\"i approve all fixes\"): a Codex planner reply took 10.7 s, two ~5 s model calls and 0.79 s before the first with no span covering it, and the trace couldn't say where the time went."
paths = ["ferb/runtimes/codex_stream.py::_observe", "ferb/runtimes/api.py::ApiRuntime._call", "ferb/runtimes/claude_sdk.py::ClaudeRuntime._events"]

[RUN-422]
title = "No sign-in check before each Codex call; Codex's own refusal tells"
by = "agent"
date = 2026-11-04
status = "active"
rule = "Codex sends no account/read before the thread. Its ChatGPT-only guard reads FERB's login file instead: ChatGPT tokens and no OPENAI_API_KEY or auth_mode apikey, else the start is refused as signed out with nothing spawned. A refreshed login is published when the request trace shows the request went out, and again at the run's end. A sign-in Codex refuses comes back as the turn's own error (CodexErrorInfo unauthorized, or a refresh-token OAuth code), marked signed_out for ORCH-315's message and offer."
why = "Owner 2026-11-04: \"so 2.7 every message is just this check??? can this be avoided?? ... if its not connected it'll give error and then we'll know wont we?\" Every Codex call spent 0.25-2.7 s in account/read (start_steps_ms.account)."
