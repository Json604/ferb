evidence = "Pinned Codex 0.166.0, temporary HOME and CODEX_HOME, a local stand-in backend: account/read waits on the workspace routing lookup (GET /backend-api/wham/accounts/check, retried); without it the turn's request went out at 0.12 s while that lookup was held 2 s."
