title = "Codex compaction: off for supervisor runs, Codex's default for workers"
by = "agent"
date = 2026-10-30
status = "active"
rule = "Supervisor (one-turn) Codex runs set `model_auto_compact_token_limit` out of reach, so an over-window prompt comes back as an overflow. Codex workers keep Codex's automatic compaction: a long tool loop compacts rather than fails (owner question T-404)."
why = "FERB already fits one-turn prompts to the window, so compaction could only rewrite FERB's context (36 planner prompts went over 244.8k tokens)."
