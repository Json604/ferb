[RUN-401]
title = "Planner caching (P20) becomes the default once the live injection test passes"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/runtimes.md owner decision 2: an agent's summary; no verbatim quote recorded in the doc"
rule = "The owner runs tests/security/test_planner_injection_real.py once after the rebuild; if it passes, the Codex planner's stable per-role cache key (`[runtimes] codex_planner_cache`) is on by default. Until then it stays off. It works with the smaller prompts: caching reuses their stable part."
