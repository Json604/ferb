rule = "A provider's refusal of a request carrying FERB's typed format (HTTP 400, not window or image; Claude Code: api_error_status 400 before output) is resent once without it, the core schema stated after FERB's cached instructions; if that is accepted the format is remembered as not fitting (in memory, per provider, model and schema, 24 h). A schema over the counted limits is stated from the start. A stated answer outside the schema is told back once in the run. Usage reports carry `typed`. Offline contract tests cover every schema FERB sends and every adapter."
