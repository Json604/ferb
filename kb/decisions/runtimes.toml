[RUN-402]
title = "Codex compaction: off for supervisor runs, Codex's default for workers"
by = "agent"
date = 2026-10-30
status = "active"
rule = "Supervisor (one-turn) Codex runs set `model_auto_compact_token_limit` out of reach, so an over-window prompt comes back as an overflow. Codex workers keep Codex's automatic compaction: a long tool loop compacts rather than fails (owner question T-404)."
why = "FERB already fits one-turn prompts to the window, so compaction could only rewrite FERB's context (36 planner prompts went over 244.8k tokens)."
paths = ["ferb/runtimes/codex_exec.py::NO_AUTO_COMPACT"]
legacy = "notes/runtimes.md Rulings (step 4) and Step 4 findings: auto-compaction"

[RUN-403]
title = "worker_type is validated per call, not an enum in the planner schema"
by = "agent"
date = 2026-10-30
status = "active"
rule = "The planner's `worker_type` is a string checked against the runtimes available now; an unknown one goes back to the planner's repair loop naming the available types, and the dispatcher is told once and asked again. Worker types live in the planner's fixed Layer 1. Nothing blames config.toml."
why = "An enum would change SUPERVISOR_SCHEMA per call, and the P20 cache keys on it."
rejected = ["An enum of available runtimes in the planner schema"]
legacy = "notes/runtimes.md Rulings (step 4) and fix list: worker_type"

[RUN-404]
title = "One runtime table: availability means model set and signed in (or key present)"
by = "agent"
date = 2026-10-30
status = "active"
rule = "ferb/runtimes/catalog.py `CATALOG` is the one list of runtimes: name, default model, sign-in kind, billing, factory, limits. A runtime is available only when its model is set and FERB's own sign-in or key is present; every former list (and `ferb setup --key`) reads it. Prices stay per model in prices.py, shared by Codex and the OpenAI API. Model defaults live only here."
why = "Runtime names were listed in five places and a Claude runtime with no model was offered to the planner and failed every call."
paths = ["ferb/runtimes/catalog.py::CATALOG", "ferb/runtimes/prices.py"]
legacy = "notes/runtimes.md target design 1 and fix list (step 4)"

[RUN-405]
title = "Codex containment fails closed; FERB's gateway stays the hard boundary"
by = "agent"
date = 2026-10-30
status = "active"
rule = "Codex runs only on the app-server path with every model-visible extra disabled (`DISABLED`), a locked model catalog (`CATALOG_LOCKDOWN`), a read-only sandbox with approval never, a tool-catalog check of the request trace that fails closed, and an item gate that stops a run on an unexpected item or server→client request, recording kind, tool and server. Any new tool Codex offers is a stop."
why = "A kill after an extra tool appears happens after the request reached OpenAI, so containment only limits damage: tools run only through the gateway."
paths = ["ferb/runtimes/codex_exec.py::DISABLED", "ferb/runtimes/codex_exec.py::CATALOG_LOCKDOWN", "ferb/runtimes/tooltrace.py", "ferb/runtimes/codex_stream.py"]
