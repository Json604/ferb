by = "agent"
date = 2026-11-01
status = "active"
rule = "`ferb runtimes pins` only reports. A pin moves to the newest release at least two days old, checked offline (never ~/.ferb, a login or a model request). Codex: package.json, package-lock.json (`npm install --package-lock-only`, `npm ci`), CODEX_VERSION and INPUT_CHARS_SOURCE, spikes/01_codex_mcp/codex_run.py last. Claude: pyproject.toml, `uv lock`, SDK_VERSION and CLAUDE_CODE_VERSION. Then the suite, mypy, and live real tests (Codex `-m real`, one owner-run `-m real_claude`)."
