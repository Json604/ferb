[RUN-419]
title = "Each model call's usage report carries its timing"
by = "agent"
date = 2026-11-04
status = "active"
rule = "Every adapter times each model call with ferb/core/timing.py CallTimer on an injected monotonic clock and adds `timing` to its usage event, whole ms and no content: runtime_ms (the call's begin to the provider request, only where the runtime shows it), ttft_ms (to the first output), generate_ms (first to last output), tail_ms (to the usage report), total_ms (their sum) and `by`. A call begins when its request is handed over or the previous call's tool result goes back."
why = "Owner 2026-11-04 (\"i approve all fixes\"): a Codex planner reply took 10.7 s, two ~5 s model calls and 0.79 s before the first with no span covering it, and the trace couldn't say where the time went."
rejected = ["A new event kind every consumer must learn", "Reading Codex's log for timestamps after the run"]
paths = ["ferb/core/timing.py", "ferb/orchestrator/worker.py::WorkerRuns._run_once"]

