[RUN-408]
title = "Provider limits are met by reshaping schemas in the adapter; core schemas stay unchanged"
by = "agent"
date = 2026-10-30
status = "active"
rule = "ferb/runtimes/schema_shape.py reshapes core schemas per provider and maps answers back before FERB's check. Anthropic API and Claude SDK: a nullable object becomes a list of at most one item, a nested nullable scalar an optional property while the 24-optional budget lasts, the rest stay unions (at most 16). Gemini: an enum holding null becomes anyOf. Core schemas in ferb/core never change for a provider."
why = "The Anthropic API refused SUPERVISOR_SCHEMA (\"too many parameters with union types\"); Claude Code marks tools strict when a request carries structured output, so Claude runs need it too."
