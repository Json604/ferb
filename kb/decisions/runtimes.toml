[RUN-405]
title = "Codex containment fails closed; FERB's gateway stays the hard boundary"
by = "agent"
date = 2026-10-30
status = "active"
rule = "Codex runs only on the app-server path with every model-visible extra disabled (`DISABLED`), a locked model catalog (`CATALOG_LOCKDOWN`), a read-only sandbox with approval never, a tool-catalog check of the request trace that fails closed, and an item gate that stops a run on an unexpected item or server→client request, recording kind, tool and server. Any new tool Codex offers is a stop."
why = "A kill after an extra tool appears happens after the request reached OpenAI, so containment only limits damage: tools run only through the gateway."
