# Decisions of area `engine` (kb/areas.toml).

[ENG-1]
title = "The rewrite lands in stages; the Mac engine at parity comes first"
by = "agent"
date = 2026-11-13
status = "active"
rule = "Stage 1: a Rust daemon that keeps today's RPC, event, extension, tool and store contracts exactly, with FERB.app and the extension unchanged. Stage 2: history owned by the engine and shared by every client. Stage 3: the phone role and the Android app. Stage 4: the iPhone app. Stage 5: closed-app notifications. A stage is cut over on its own; the Python daemon stays the shipping one until stage 1's checks and the owner's live checks pass."
why = "The research put the port, shared history, phones and push behind one cutover that needs a physical iPhone and an Apple push key. A parity port on the unchanged schema can be compared with Python, released and rolled back; each later stage is then a small change on a working engine."
rejected = ["One cutover for everything (MIGRATION-PLAN.md M14): nothing reaches a live check until all of it is done, and a regression can't be told from a design change."]
untestable = "An order of work; the journal and git show it."

[ENG-2]
title = "The Rust engine ships without Python"
by = "agent"
date = 2026-11-13
status = "active"
rule = "No Python interpreter is bundled for the Rust daemon. Claude runs by driving the pinned bundled claude program's stream-json mode directly, as the Python SDK does (ferb/runtimes/claude_sdk.py uses no hooks, permission callbacks or session resume)."
why = "A Python bridge would keep the bundle's signing weight and add a new permission-holding entry mode to the host, for an SDK that only starts that program."
rejected = ["A small pinned Python Claude SDK bridge (MIGRATION-PLAN.md M08.4)."]
untestable = "A packaging rule until the runtime port exists; its adapter contract tests will carry it."

[ENG-3]
title = "A port is checked against what the Python build produces"
by = "agent"
date = 2026-11-13
status = "active"
rule = "Where the output of Python code reaches a model, a client, the extension or the database (redaction, prompt assembly, tool schemas, wire frames, migration checksums), the Rust port is tested against fixtures written by running that Python code on invented data (rust/fixtures, each with the script that made it). Tests use temporary folders only, never ~/.ferb, the Keychain or a real provider."
why = "Python's json.dumps spacing, pydantic's schemas, jsonschema's error text and the re module's lookaround differ from Rust's defaults; a drift there changes prompts, caches and what gets redacted without any test noticing."
untestable = "A testing method; each fixture test is the evidence."

[ENG-4]
title = "One copy of the migrations while both daemons exist"
by = "agent"
date = 2026-11-13
status = "active"
rule = "The Rust store applies the same migration files as Python, read from ferb/store/migrations, and records the SHA-256 of their exact bytes as Python does. No schema above 0062 is added before stage 1 is cut over."
why = "The Python daemon refuses a newer store and a changed checksum (ferb/store/db.py); keeping the bytes and the schema lets either daemon open the same store, so stage 1 can be rolled back."
untestable = "Covered by the store crate's migration tests once written (ENG-3)."

[ENG-5]
title = "A shared Rust foundation: portable engine crates and one Mac platform crate"
by = "agent"
date = 2026-11-13
status = "active"
rule = "The engine lives in portable crates that must compile for iOS and Android (rust/gate.sh portable). Whatever calls an Apple framework or a macOS-only tool lives in ferb-platform-macos, or in a cfg(target_os = \"macos\") module of a hands crate, and reaches the engine only through traits. The store and the daemon programs are Mac-side. Python's own behavior (json.dumps, times, str) is in ferb-py, once."
why = "The same engine must serve the iPhone and Android apps (PROJ-508); the owner liked this separation in the earlier research. Ports by separate agents had left Mac code inside shared crates."
rejected = ["Placeholders for Windows and Linux (PROJ-506 keeps FERB to Mac, iPhone and Android)."]
untestable = "Checked by the gate's portable build rather than a test."

[ENG-6]
title = "A bug found in the Python code is fixed in the Rust port"
by = "agent"
date = 2026-11-13
status = "active"
rule = "When a port finds a bug in the Python code, the Rust port fixes it as the part is ported. The fixture test names that one deliberate difference, the journal lists it under \"Fixed against Python\", and rust/PLAN.md keeps the table. Any other difference from Python is a drift, not a fix."
why = "The first rule was to mirror Python and fix both later; the owner asked why known bugs, one of them a secret left unredacted, were being carried into new code."
rejected = ["Mirror every Python bug so the comparison stays exact, and fix both sides after the cutover."]
untestable = "A working rule; each fix has its own named test."
