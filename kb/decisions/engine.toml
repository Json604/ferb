by = "agent"
date = 2026-11-15
status = "active"
rule = "rust/fixtures/<part>/make.py and their helpers stay in the repo unchanged after the Python code leaves; they run only in a worktree at the commit before the removal (rust/fixtures/README.md). A Python-recorded fixture changes only as a named difference (ENG-6, or a deliberate change listed in the journal and named in its test), never by regenerating it from the Rust code. Generated tables' headers point at that README."
