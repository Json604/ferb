[TEST-505]
title = "Upgrade tests start from stores as older builds really left them"
by = "agent"
date = 2026-11-01
status = "active"
rule = "Upgrade tests build stores and configs as older builds left them (every older schema, the pre-checksum runner, a deleted migration from git history, migrations as first written in tests/fixtures/migrations/older) and upgrade them to current with the data kept and an integrity check."
