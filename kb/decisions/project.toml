[PROJ-511]
title = "kb paths under a moved folder are read at the new place, before history"
by = "agent"
date = 2026-11-16
status = "active"
rule = "kb/config.toml `moved` lists {from, to, why}. A record's path that names nothing tracked now is read at its place under `to` (longest `from` wins), then in `historical`. kb show for a file at its new place lists the records naming its old place; generated rules use new places. A `to` must exist and never move again (no chain or cycle). Records keep their paths as written."
why = "PROJ-510 moved rust/, ferb/, ui/ and extensions/: 1,397 decision paths name the old places. Records are never rewritten and history still holds the old layout, so the tool resolves a move instead of the records changing."
rejected = ["Rewriting the records' paths: owner records are never reworded.", "Listing the moved folders in `historical`: the files exist now and must be checked on the current tree, and kb show must find them at their new place."]
paths = ["tools/kb/kb.py", "tools/kb/test_kb_moved.py", "kb/config.toml"]

