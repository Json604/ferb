by = "agent"
date = 2026-10-31
status = "active"
rule = "The planner sees similar existing facts and names any a new fact replaces (`replaces`, ids checked by code); the \"Memory: noted\" line names what was replaced. A version resting on the owner's words now ends every current version of its fact and the named ids that hold; any other version never ends one the owner stated. Identical words are credited to the existing item (the owner's first), never a twin."
evidence = "Live case 2026-10-31: appointment_preferences kept \"notify me before booking\" after the owner said to just book."
paths = ["ferb/memory/items.py::Memory.save", "ferb/memory/items.py::Memory._replaceable"]
