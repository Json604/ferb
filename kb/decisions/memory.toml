[MEM-25]
title = "Embedding model: minishlab/potion-base-8M read by FERB's own code"
by = "agent"
date = 2026-10-31
status = "active"
rule = "The embedding model is minishlab/potion-base-8M (MIT, pinned revision and SHA-256s), a static table (29,528 WordPiece tokens x 256 float32; a text = the normalized mean of its tokens' rows), read by FERB's own tokenizer and memory-mapped safetensors: no numpy, torch, MLX or onnxruntime. Its vocabulary is English-only; other languages and coined words fall back to keywords."
why = "Small and cheap enough to run in the background without heat: no new framework, ~10 MB RAM, sub-millisecond per short text."
rejected = ["MiniLM/bge through onnxruntime: a ~30 MB native runtime plus a 23-130 MB model and a transformer pass per text", "The old MLX path (mlx plus transformers)", "Apple's NLEmbedding: a new PyObjC binding, quality not evaluated"]
evidence = "2026-10-31 M-series: 31 MB download, 27 ms load, +10 MB RSS, 0.2 ms per short text; owner-shaped store backfill 1.2 s CPU, 9 ms a planner query; related pairs 0.21-0.47, unrelated -0.09-0.14."
paths = ["ferb/memory/embeddings.py"]
legacy = "notes/memory.md Rulings (step 9b): embedding model"

