by = "agent"
date = 2026-10-31
status = "active"
rule = "The owner's words hold up at once. FERB's understanding and observed facts hold up once their sources span two separate days, or once they have stood a full weekly pass (7 days) without being replaced, retired or forgotten. An item the owner kept under an older build's Keep question holds up at once; the old setup dump never does. \"Used without correction\" (MEM-12) needs exposure records."
paths = ["ferb/memory/profile.py"]
legacy = "notes/memory.md Rulings (step 9a): holds up"

[MEM-19]
title = "What code adds to Tier 1 between profile passes"
by = "agent"
date = 2026-11-01
status = "active"
rule = "Code joins the owner's words about anything at once, under \"Recently said\" while it fits, except a fact the owner placed by search (memory.search_only). Code joins FERB's understanding / observed facts about the owner (subject \"owner\") only on an event that shows them holding up (a save on a second day); \"standing 7 days\" is the weekly pass's to see. The pass places the rest and stays the only scheduled rewrite. The owner's \"Always on\" pins survive every pass."
paths = ["ferb/memory/profile.py::CoreProfile.saved"]
legacy = "notes/memory.md Rulings (step 9a) code's own Tier 1 additions; (step 9b) decision 18"

