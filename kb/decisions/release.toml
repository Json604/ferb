title = "Finder's black labels hide on the field's black; the names are drawn white"
by = "agent"
date = 2026-11-04
status = "active"
rule = "Finder draws icon labels black over a background picture in any appearance; no view option changes it (macOS 27.2: icvp textColor in any form is ignored). So the background draws the names in white, and Finder's labels, at its smallest size (10), fall on a soft pool of the stage's black under each icon, unseen. Labels to the right scroll the window sideways. WindowBounds is the whole window: the 680 x 440 content plus a 32-point title bar (macOS 26+); on a 28-point title bar the window is 4 points taller than the picture (macOS 15 not checked)."
paths = ["scripts/dmg_layout.py", "scripts/dmg-background/main.swift"]
live = ["LIVE-745"]

