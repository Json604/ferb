[REL-421]
title = "devid signing: the team's Developer ID by hash; pieces, app and image checked against the team"
by = "agent"
date = 2026-11-13
status = "active"
rule = "SIGN_IDENTITY=devid signs with the one valid \"Developer ID Application\" identity of scripts/developer-team.txt's team, by its SHA-1 (none or two refuse; its name is never printed). Pieces keep codesign's default requirement and are verified against identifier + anchor apple generic + leaf OU = team; library validation stays on; app and DMG are notarized and stapled. A DMG takes only a stapled, Gatekeeper-notarized team app and is itself checked with spctl; release-appcast.sh refuses any other DMG before EdDSA signing. Release mode stays until the first devid release passes its live checks."
why = "kb/plans/developer-id.md §3: selecting by name would put a legal name in commands and env files, and a same-team Apple Development or Installer certificate would be refused by notarization; until now a Developer ID app entered a DMG unchecked."
rejected = ["Select the identity by its name: the legal name in commands and env files", "Default NOTARY_KEYCHAIN_PROFILE to the owner's profile name: a missing profile would show only after a full build; the variable stays explicit and is checked first", "Re-sign the DMG's pieces in release-appcast.sh: it only checks; signing stays in build-app.sh and build-dmg.sh"]
paths = ["scripts/signing.sh", "scripts/build-dmg.sh", "scripts/release-appcast.sh", "scripts/build-app.sh"]
live = ["LIVE-941", "LIVE-942"]

[REL-422]
title = "Every Mach-O file in FERB.app is found by its content, signed and checked"
by = "agent"
date = 2026-11-13
status = "active"
rule = "signing.sh picks the code it signs by file(1)'s Mach-O type, not by name or execute bit, and after signing verifies every Mach-O file in the bundle with codesign --verify --strict, in every mode; in devid mode each must also meet the team requirement unless it is another team's Developer ID code kept as its vendor signed it (Codex, Claude Code). One failure stops the build before notarization and names the file."
