[REL-454]
title = "How the site does REL-453: derived rotation pairs, refusal reasons, hashed tombstones, schema mark"
by = "agent"
date = 2026-11-24
status = "active"
rule = "For REL-453, refining REL-452's reuse. A rotation's pair is HMAC(AUTH_SECRET, old refresh token), issued at the rotation's time; the old token within 60 s, before the new one is used, gets it again. invalid_grant carries reason signed_out, expired or account_deleted (hashes in ferb_app_deleted). Sweep on every grant, bounded. Names: 200 code points, cut. A Mac start's errors 303 to its loopback. Android's landing uses an intent link. Schema runs unless ferb_app_limits carries the version comment. Owner list: providers, last sign-in, devices."
why = "Only token hashes are kept, so answering the same pair twice needs it derived; an HMAC with the site's secret is as unguessable as random. Hashed tombstones are the one way another device learns the account is gone. A table comment marks the version in the query already made."
rejected = ["Keeping the new pair's plaintext for 60 s: tokens would be stored readable", "A new random pair on each retry: two live refresh tokens in one family", "Running every schema statement on each cold start: about a dozen round trips per cold start"]
paths = ["site/api/_lib/app.js", "site/api/_lib/store.js", "site/api/_lib/apple.js", "site/api/_lib/handlers.js", "site/sql", "site/tests", "site/privacy.html"]
live = ["LIVE-1202", "LIVE-1203"]
