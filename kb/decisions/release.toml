[REL-423]
title = "Every appcast from the first Developer ID build on names it as minimumAutoupdateVersion"
by = "agent"
date = 2026-11-13
status = "active"
rule = "For APP-903. release-appcast.sh reads the DMG app's TeamIdentifier; the first team-signed release writes its build (the earlier of the two architectures') to scripts/developer-id-first-build.txt, to be committed, and make_appcast.py puts it in every later item as sparkle:minimumAutoupdateVersion. A minimum above the build being published is refused."
