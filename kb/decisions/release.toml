rule = "For REL-449, APP-1137. As REL-451 (start, callback, token, me, signout, delete, assertion, ready; PKCE codes; opaque rotating tokens, REL-445; rate limits) with: a Mac returns only to http://127.0.0.1:<port>/callback (port 1024-65535, no leading zeros, nothing else in it), never ferb-auth://callback; apple: the iPhone's identity token checked against Apple's JWKS, audience com.ferb.phone, nonce = SHA-256 hex of the raw nonce sent, each nonce once in 10 minutes, then the code grant's account linking, device record, rate limit and answer."
why = "PKCE with an exact return rule (RFC 8252): a loopback code is useless to another program without the verifier. No released build used the Mac's scheme; the owner's test build stays signed in. Apple's hashed nonce is its documented form; taking it once stops a replay."
rejected = ["Keeping ferb-auth://callback for a Mac: a second return path with the system alert, kept only for a test build", "The Apple authorization code exchanged with Apple's token endpoint as well: a client secret for a second client id, and nothing more proven than the signed identity token"]
paths = ["site/api/app", "site/api/_lib", "site/sql", "site/tests", "site/vercel.json", "site/env.example"]
live = ["LIVE-1202", "LIVE-1203"]

[REL-453]
title = "The account audit's fixes: a sign-in the site ends keeps the pairing; each failure says why"
by = "owner"
date = 2026-11-24
status = "active"
words = "yes"
words_source = "Owner 2026-11-24, relayed by the coordinator, to the fourteen fixes an audit of FERB's account system listed (journal 220 has the list)."
rule = "A sign-in the site ends (reused after a 60 s grace in which the old refresh token gets the same new pair; expired after 180 days; signed out) only asks to sign in again, with why: phones stay paired, the Mac keeps its phones; only a deleted account also unpairs a phone. A name never blocks sign-in. Each failure has its own true words. Delete succeeds only when the site confirms. The sign-in screens say to use the same account on both; Hide My Email is named in a mismatch. Sign-outs reach other devices on focus or open."
why = "The audit found sign-outs that lost the pairing for a lost reply, a name that blocked sign-in forever, and wrong or missing reasons; the owner said yes to fixing them all."
paths = ["site/api/_lib/app.js", "site/api/_lib/store.js", "site/api/_lib/handlers.js", "apps/mac/FERBNotch/Sources/NotchCore/Account.swift", "engine/crates/ferb-daemon/src/account.rs", "engine/crates/ferb-daemon/src/phone/account.rs", "apps/android", "apps/ios"]
