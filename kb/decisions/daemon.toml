[DMN-15]
title = "FERB.app's service: the setup command does the file work, the app registers"
by = "agent"
date = 2026-10-31
status = "active"
rule = "FERB.app's definition is fixed and signed, so it names no user paths. `ferb setup --service` (run by the app) does the file work: retires the old user LaunchAgent (only a plist naming FERB's label) and records ~/.ferb/service.json (build, app, label). Then the app registers the service with SMAppService and shows macOS's \"needs your OK\" when asked. Launch decides from the old LaunchAgent, the service status and that record."
why = "Python can't call SMAppService for the app's bundle, and launchd can't hold the same label twice."
paths = ["ferb/device/install.py", "ui/mac/FERBNotch/Sources/FERBNotch/SetupServices.swift"]
