[DMN-30]
title = "Relay protocol: the Worker streams the file it never parses, then files a ticketed issue"
by = "agent"
date = 2026-11-01
status = "active"
rule = "POST /file carries GitHub's exact create-file JSON built by FERB; the Worker checks headers, query and rate limit, picks reports/YYYY/MM/<id>-<8 random>.txt, streams the body to the Contents API and returns a signed 1-hour ticket (409 retry on a commit conflict). POST /report with that ticket files one issue whose path comes from the Worker; kind and id come from the ticket; every sender-supplied text sits inside a code block."
why = "Workers free plan allows 10 ms CPU per request; the Contents API is one call, works on an empty repo and allows 100 MB files."
evidence = "2026-11-01 docs: Workers 10 ms CPU, fetch waits not counted, 100 MB body, 128 MB memory; GitHub Contents 100 MB, 10 s processing cap. Unconfirmed: streaming costs no CPU per byte; a ~33 MB Contents request is accepted (LIVE-4)."
