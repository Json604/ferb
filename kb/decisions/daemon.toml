[DMN-13]
title = "Heavy and blocking work stays off the event loop"
by = "agent"
date = 2026-10-30
status = "active"
rule = "Blocking calls (codesign, the sandbox check, profile discovery, TCC checks, image work) run in worker threads. The retention pass reads what to delete in a worker thread on a read-only connection, then deletes on the loop's connection 200 rows a transaction, leaving the loop free between batches."
why = "A worker-thread writer would make the loop's writes wait on SQLite's lock; the batched pass kept the longest loop gap at 189 ms on a copy of the owner's store (2026-10-31)."
paths = ["ferb/store/retention.py::plan", "ferb/store/retention.py::BATCH"]
legacy = "notes/daemon.md target design 6; fix list (steps 2, 12a)"

[DMN-14]
title = "The installed daemon never imports a checkout's code"
by = "agent"
date = 2026-10-31
status = "active"
rule = "Every daemon and native-host launch runs Python with -P (never prepend the working directory) and FERB's home as the working folder. FERB.app's definition runs the agent with exactly -m ferb.daemon; the daemon makes FERB's home its working folder and sends output launchd left at /dev/null to logs/daemon.{out,err}.log."
why = "A LaunchAgent with WorkingDirectory set to the checkout ran python -m ferb.daemon, so the owner's FERB loaded the checkout's code; the rebuild deleting a file broke a scheduled run on 2026-10-31."
