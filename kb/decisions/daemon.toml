[DMN-402]
title = "App-only RPCs check the socket peer's audit token against FERB.app's designated requirement"
by = "agent"
date = 2026-10-31
status = "active"
rule = "RPCs in `auth.APP_ONLY` (e.g. `tasks.preview`) answer only FERB.app: the kernel's audit token of the socket peer (LOCAL_PEERTOKEN) checked by the Security framework against the designated requirement of the FERB.app the daemon runs from (else /Applications then ~/Applications), re-derived when that bundle's signature changes and checked per connection. Any failure to check fails closed; only a daemon run from a source checkout accepts the notch's identifiers."
