[DMN-16]
title = "A checkout's launch path never takes over FERB.app's service"
by = "agent"
date = 2026-10-31
status = "active"
rule = "A checkout runs under the same label as a user LaunchAgent (~/Library/LaunchAgents, -P, working folder FERB's home), loaded with launchctl; FERB.app never writes one. A checkout refuses to install or uninstall, before changing anything, while launchd runs FERB's label from a definition that isn't the checkout's (one check_not_foreign)."
why = "Only FERB.app can unregister its service; removing the rest (native-host manifests, a purge of ~/.ferb) would break the running FERB.app install, and booting it out left the registration with nothing running."
paths = ["ferb/device/install.py::Installer.check_not_foreign", "ferb/device/install.py::Installer.foreign_service"]
legacy = "notes/daemon.md Rulings (step 12b; 12e review)"

[DMN-17]
title = "Stopping FERB.app's daemon is a clean kill and a kickstart"
by = "agent"
date = 2026-10-31
status = "active"
rule = "Work that needs the daemon stopped stops FERB.app's service with launchctl kill SIGTERM, waits for its process, then kickstarts it; the registration stays untouched. If the daemon is still exiting after the 10 s wait, the work does not run (InstallError) and the daemon is started again either way."
why = "A clean exit isn't restarted (KeepAlive SuccessfulExit false), and bootout/bootstrap can't reload a BundleProgram definition."
paths = ["ferb/device/install.py::Installer.while_stopped", "ferb/device/install.py::Installer.exiting"]
legacy = "notes/daemon.md Rulings (step 12b; 12e review)"

