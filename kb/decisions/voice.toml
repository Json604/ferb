status = "active"
rule = "FERB.app sends every message without `speak`; `chat.send` ignores a `speak` an older app still sends. ferb/voice/speak.py (Speech, providers) and `voice.said`/`voice.failed` are gone. The config upgrade `no-voice-2026-11-04` drops `[voice] tts`, `voice`, `rate` once, journaled (`config.upgraded`); `[voice] requirement` (hearing) stays. The always-on About line (\"Facts about this FERB\") and AppGuide's \"Talk to FERB\" say replies are text only. Send on release stays off by default (`voice.sendOnRelease`)."
why = "VOICE-409. One shared path: the facts every role takes and the guide FERB.app sends, so no prompt or tool has its own copy."
