[VOICE-404]
title = "Every new message and every stop interrupts speech; a turn's utterances queue in order"
by = "agent"
date = 2026-10-31
status = "superseded"
superseded_by = "VOICE-409"
rule = "Any new message, typed or spoken, `task.stop` (whatever ids) and the global stop interrupt what FERB is saying; the daemon's shutdown ends it. Within one turn, utterances queue in order (plan line, then the answer) rather than cutting each other off."
why = "speak.py's original rule: the owner typing cuts off what it was saying."
paths = ["ferb/daemon/areas/voice.py"]
legacy = "notes/voice.md Rulings (step 11) 2"

[VOICE-405]
title = "What a voice turn says aloud"
by = "agent"
date = 2026-10-31
status = "superseded"
superseded_by = "VOICE-409"
rule = "A turn sent with `speak: true` speaks its reply, its task's plan line (not again for a resumed task) and the answer, without code's lines after them (sites contacted, schedules, apps left open). Questions FERB asks during a voice task are not spoken; they show in the notch. A spoken message merged into an earlier turn makes that turn spoken. Words come from structured events, never CLI rendering."
why = "Owner decision 3 says replies are spoken."
paths = ["ferb/daemon/areas/chat.py"]
legacy = "notes/voice.md Rulings (step 11) 3 and fix list"

[VOICE-406]
title = "Speech is redacted on one shared path for every provider, before and after reshaping"
by = "agent"
date = 2026-11-01
status = "superseded"
superseded_by = "VOICE-409"
rule = "`Speech.say` redacts the raw text, reshapes it for speech (`spoken`), then redacts again, before any provider is built; no provider, hosted or local, can receive unredacted text and none needs a flag. `voice.said` and `voice.failed` carry only redacted words."
why = "`spoken` strips marks like ** __ # $ { } ~, so a saved value holding them no longer matched once reshaped and was spoken and published (12e review)."
legacy = "notes/voice.md Rulings (step 11) 4 and 9"

[VOICE-407]
title = "Speech providers are a registry; one built per utterance from current settings"
by = "agent"
date = 2026-10-31
status = "superseded"
superseded_by = "VOICE-409"
rule = "`PROVIDERS` in ferb/voice/speak.py is the registry, like the runtime catalog: `[voice] tts` (default \"macos\"), `voice`, `rate`. A provider is built per utterance, so an edit applies to the next one without a restart; a bad value is journaled `voice.failed` once per turn's queue and nothing is spoken. `MacVoice` passes the text to `/usr/bin/say` on stdin, never argv."
legacy = "notes/voice.md Rulings (step 11) 5, target design 2, fix list"

[VOICE-408]
title = "Voice settings are checked for validity only, with no FERB-chosen range"
by = "agent"
date = 2026-10-31
status = "superseded"
superseded_by = "VOICE-409"
rule = "`[voice] rate` is checked only as a positive finite number of words per minute; `voice` only for shape (non-empty, not option-like, no control characters). A voice macOS doesn't know makes `say` fail, journaled."
why = "Argument validity is code's job; a range would be an undecided cap."
legacy = "notes/voice.md Rulings (step 11) 6"

[VOICE-409]
title = "FERB has no voice: every reply is text; dictation stays"
by = "owner"
date = 2026-11-04
status = "active"
supersedes = ["VOICE-401", "VOICE-403", "VOICE-404", "VOICE-405", "VOICE-406", "VOICE-407", "VOICE-408", "APP-402"]
