rule = "The one push-to-talk path is the app's dictation (hold Right Command + Option, the Mac's language), with an option to send on release; replies are spoken through the pluggable speaker. The daemon's push-to-talk stack goes (voice controller, mic, push_to_talk, the voice role and `voice.*` RPCs, key forwarding, FERB Voice's serve/Listener/request modes). FERB Voice keeps `transcribe`, `status`, `request-speech` for hearing."
