words_source = "The owner in the session of 2026-11-04, after a dictated \"do you also speak back?\" was answered in the chat with \"I currently reply in text\" while macOS's voice read that answer aloud."
rule = "FERB never speaks: no reply, plan line, answer, question or notice is read aloud, for a typed or a dictated message; there is no speech provider and no speech setting. FERB's facts and app guide say it takes typed or dictated messages and always replies in text. Still as before: the one push-to-talk path is the app's dictation (hold right Command + Option, on-device), with an option to send on release; FERB Voice is merged into FERB.app, which answers transcribe, status and request-speech for hearing, with one Speech Recognition grant; FERB's sounds stay."
paths = ["ferb/daemon/areas/voice.py", "ferb/daemon/areas/chat.py", "ui/mac/FERBNotch/Sources/FERBNotch/DaemonConnection.swift", "ui/mac/FERBNotch/Sources/FERBNotch/Hearing.swift"]
live = ["LIVE-762", "LIVE-763"]

[VOICE-410]
title = "How the voice was removed: no speak flag, retired settings, true self-description"
by = "agent"
