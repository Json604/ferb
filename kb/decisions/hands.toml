# Decisions of area `hands` (kb/areas.toml). Moved from notes/memory.md and notes/voice.md on 2026-11-02.

[HAND-1]
title = "Bot checks are named in the snapshot from known challenge frames"
by = "agent"
date = 2026-10-31
status = "active"
rule = "A frame whose address is a known challenge frame (Cloudflare Turnstile, hCaptcha, reCAPTCHA, Arkose, DataDome, AWS WAF, GeeTest; snapshot.CHALLENGE_FRAMES) puts `bot_check` {widgets, frames, ability browser_verification, read} first in the snapshot result."
why = "The extension already reports each frame's address and each frame element's src: no protocol change, no extension reload."
paths = ["ferb/act/browser/snapshot.py::CHALLENGE_FRAMES"]
legacy = "notes/memory.md Rulings (step 9b): bot checks"

[HAND-400]
title = "No music recognition for now"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/voice.md owner decision 4 (\"Music recognition: not now\"): an agent's summary; no verbatim quote recorded"
rule = "FERB does not recognise music by its sound. Workers keep being told so: asked what a song is, they listen on the tab the owner means and, hearing no lyrics they can identify, say so, never naming something else as the song."
rejected = ["Pressing Control Center's Recognize Music through accessibility (drives system UI, writes the owner's Shazam history)", "ShazamKit on FERB's captured app audio (likely needs a paid Apple Developer App ID; a new hosted destination)"]
paths = ["ferb/act/listen.py"]
legacy = "notes/voice.md decision 4"

[HAND-401]
title = "No muting while FERB listens, for now"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/voice.md owner decision 5 (\"Muting while FERB listens: not now\"): an agent's summary; no verbatim quote recorded"
rule = "While FERB listens to an app or tab, the owner hears it too: FERB captures the app's audio unmuted (a tab listen hears the whole browser)."
rejected = ["Muting the page's media element (FERB hears nothing either)", "chrome.tabCapture (needs a user gesture and a protocol change)", "A Core Audio process tap muting when tapped (FERB's browser is the owner's Chrome process; muting it mutes the owner's Chrome)"]
paths = ["ferb/act/listen.py", "ferb/act/mac/audio.py"]
legacy = "notes/voice.md decision 5"
