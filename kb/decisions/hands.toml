status = "active"
rule = "The daemon takes a native-host connection only when the host's parent process runs a browser app FERB knows (peer_refusal, the .app's bundle id via libproc), and a paired profile's hello only from that browser. Any process of the owner's user can still start a browser binary with its own profile or read a pairing key from extension storage: same-uid processes are trusted."
paths = ["ferb/act/browser/ext_bridge.py::peer_refusal", "ferb/native_host"]
