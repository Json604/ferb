[HAND-222]
title = "Daemon-to-extension messages are signed; a failed check gets no reply"
by = "agent"
date = 2026-10-30
status = "active"
rule = "welcome and cmd are {type, seq, body, mac}, HMAC-SHA256(pairing key, nonce|seq|type|body) with the hello's fresh nonce and a per-connection counter; each part of an assembled command and the envelope are verified. Unsigned replies change no page. A command that fails verification is dropped without a reply, so the daemon times out (unknown, the safe side). The extension accepts `paired` only during pairing."
why = "Echoing an unverified id could fail a real command early."
paths = ["extensions/chromium/background.js", "ferb/act/browser/ext_bridge.py"]
legacy = "notes/hands.md Rulings (step 5c): signing"

