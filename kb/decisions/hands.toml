[HAND-226]
title = "Local socket facts come from libproc in FERB's process, with nettop for the rest"
by = "agent"
date = 2026-10-31
status = "active"
rule = "Sockets are read with libproc in FERB's own process (no subprocess; an answer of any size other than 792 bytes is no reading). The proxy route uses only it: the connected server socket must belong to an inspectable process. The profile route's direct ports need every user's listeners: nettop adds the uninspectable ones (unnamed, never pinned), counted only when it lists every listener libproc found and every line parses. Shared sockets are checked once per process."
why = "From macOS 27.2 the kernel's socket lists hold only the caller's own sockets for an ad-hoc-signed Python and its children, so netstat printed nothing and FERB refused every local port."
evidence = "2026-10-31, Darwin 27.2.0: netstat -anv exits 0 and prints nothing from FERB's venv; 6 shell/proxy tests failed on clean 41ef7dff. libproc ~2 ms, nettop ~9 ms per reading."
paths = ["ferb/act/shell/sockets.py", "ferb/act/shell/local.py"]
legacy = "notes/hands.md Rulings (regression 2026-10-31, macOS 27.2)"

[HAND-227]
title = "A queued local connection is waited for at most 30 s"
by = "agent"
date = 2026-10-31
status = "active"
rule = "LocalAccess.connected re-reads while a visible listener on that port has a queued connection, at most ACCEPT_WAIT = 30 s (the proxy's own connect timeout), then refuses; with nothing queued on a visible listener it refuses at once."
why = "A connection the server hasn't accepted yet is in no descriptor table, only counted in its listener's queue (libproc, measured)."
paths = ["ferb/act/shell/local.py::ACCEPT_WAIT"]
legacy = "notes/hands.md Rulings (regression 2026-10-31): accept wait"

[HAND-228]
title = "FERB's proxies listen with the kernel's maximum backlog"
by = "agent"
date = 2026-10-31
status = "active"
rule = "The shell's egress proxy and the Claude runtime's tool-list relay listen with socket.SOMAXCONN (capped by kern.ipc.somaxconn, 128 here), not socketserver's default 5."
why = "macOS resets a connect past a full backlog, so a busy accept loop or a burst (parallel package downloads, a flood) reset legitimate clients."
evidence = "One busy thread, 8 runs each: backlog 5 reset 8 of 8; backlog 128 none (25 of 25 alone)."
paths = ["ferb/act/shell/proxy.py", "ferb/runtimes/proxy.py"]
legacy = "notes/hands.md Rulings (step 12d)"

