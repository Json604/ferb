[HAND-201]
title = "One collapsed tab group per task, holding only tabs FERB opened"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/hands.md owner decision 3: an agent's paraphrase of the owner's ruling; no verbatim quote recorded"
rule = "One collapsed, labelled group per task with only FERB's tabs. FERB never closes a tab it didn't open; a borrowed owner tab is never grouped or closed. A result tab is handed over (moved out, open); the rest close at task end. A tab dragged out becomes the owner's; one dragged in stays the owner's. Closing a FERB tab or the group mid-task = owner stopping that part (FERB asks to continue). \"Keep the tabs open\" ungroups them; pause keeps the group; loops keep it collapsed; after a reconnect or restart FERB re-adopts or closes it (no orphans)."
why = "A profile with no window uses FERB's minimized window. Needs `tabGroups` and one protocol bump (manifest, JS/Python protocol, minimum versions together)."
