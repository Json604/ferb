[SENSE-431]
title = "A notification's de-dup row goes once Notification Center no longer has it"
by = "agent"
date = 2026-11-24
status = "active"
rule = "perception_seen rows (source 'notification') are deleted once their record is gone from Notification Center: the watcher reads every record's id at its first read after a start and then hourly (prune_s), and the trail's thread deletes the seen rows not among them, after the records read before it. A record still there keeps its row, so a restart's full read never records it twice; no age or number is involved."
why = "T-2: the rows were never purged. An age alone could drop the row of a notification still in Notification Center, and the first read after a restart reads every record again, which would record it again as new once the trail's own copy is gone (30 days)."
evidence = "ferb-sense tests/perception.rs seen_rows_go_once_notification_center_no_longer_has_them; tests/watchers.rs the database's present ids; tests/manager.rs the watcher prunes on its first read."
