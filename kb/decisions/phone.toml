# ---- 2026-11-16: the agent's rulings from the reassessment (PHN-411)

[PHN-440]
title = "The link stays on iroh: one Rust crate, ferb-link, for the Mac and the phones"
by = "agent"
date = 2026-11-16
status = "active"
rule = "The link is one Rust crate, ferb-link, on iroh 1.4.1 from crates.io with the one pinned patch of PHN-222: the Mac's helper is a program of it and the phones use it through ferb-mobile. No address lookup (PHN-204). It is ported from the lab with its test suites."
why = "End-to-end encrypted QUIC with hole punching, relay fallback and no FERB-run server; the lab measured tiers, handover, the own relay and abuse caps on it (PHN-2xx). Replacing it restarts those measurements."
rejected = ["WebRTC data channels: need a signalling server FERB would run.", "A FERB-run relay or server as the default: a service someone operates (PHN-421 keeps only a small push sender, stage 5).", "A VPN account (Tailscale-style): a third party and an account per user."]

[PHN-441]
title = "The link runs as its own signed helper; the daemon decides everything"
by = "agent"
date = 2026-11-16
status = "active"
rule = "In FERB.app the link is a separate program in the bundle, signed with FERB's certificate, holding no macOS permission. ferbd starts and stops it; it reaches the daemon only over the RPC socket as role phone. The daemon holds devices and keys, gives challenges, verifies every proof and opens every file (PHN-124). Its secrets are read through ferb-secrets (PHN-143)."
why = "The network code (UDP sockets, relays, iroh's dependencies) stays out of ferbd, which holds FERB's permissions and runs only daemon, mcp and grant-probe (ENG-7); a fault there lands in a process with no grants."
rejected = ["iroh inside ferbd: the permission-holding process would parse untrusted network input.", "The helper verifying proofs: the daemon would then trust it (PHN-124)."]

[PHN-442]
title = "Pairing is kept as the lab built it"
by = "agent"
date = 2026-11-16
status = "active"
rule = "Pairing stays: a QR or typed code carrying a 256-bit one-time secret proven by a keyed hash, a 120 s single-use window, the matching 6-digit code on both screens and the owner's Yes on the Mac (PHN-102, PHN-136, PHN-142)."
why = "It closed the validation's stranger-pairing hole and passed the review's attacks; a short typed code would need a meeting point (lab T-25)."

[PHN-443]
title = "The phone's three keys are kept"
by = "agent"
date = 2026-11-16
status = "active"
rule = "Each phone has three hardware-held keys: the device key (no prompt; proves this phone for notification text and the session, PHN-126), the lock key (PIN or biometric; the unlock window and private answers) and the fingerprint-only key (sensitive calls, key places, a hard Yes, payments and terminal typing: PHN-133, PHN-137, PHN-403). The daemon verifies each for the exact call."
why = "Each stops a different holder: a copied link key, an unlocked phone in another hand, someone who knows the PIN. Merging two loses one of those."

[PHN-444]
title = "The public relay carries text, questions and Stop; bulk is refused with stable codes"
by = "agent"
