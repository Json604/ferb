[PHN-114]
title = "Unlock, path safety and the audit for files and private data"
by = "agent"
date = 2026-11-10
status = "active"
rule = "One unlock on the phone (a signed proof, verified on the Mac) opens the owner's data for unlock_idle_s of idle time, so a burst of files needs one prompt. Every path is resolved by the daemon first: where links and `..` really lead decides; FERB's own data is never shown; a protected folder is asked about once (a signed Yes) until the phone locks. A folder is never fetched as one. Every call and fetch is one line in audit.jsonl on the Mac (method, class, outcome, path, bytes; never a value), which no phone call reads or changes."
why = "What this stops: a borrowed unlocked phone browsing files; link and `..` tricks; silent drains. What it cannot stop: a photo of the screen, a rooted phone, or the owner himself once unlocked."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/security.toml SEC-14."
legacy = "ferb-phone-link@57b3f34 SEC-14; lab paths: rust/src/bridge.rs, rust/src/store.rs, standin/daemon.py"

