[PHN-144]
title = "The seal on link.json is judged from the file's own text, so a build with other settings opens it"
by = "agent"
date = 2026-11-10
status = "active"
rule = "The seal is the keyed hash of link.json's text as written: compact JSON (only the spacing between its parts dropped) without its last member, seal. A start checks the text on disk, never the state read into this build and written out again; a save is checked the same way before it is written. Refused: any change that says something else, members in another order, a seal missing, empty or not last. Accepted: other spacing only. The refusal says nothing was removed and names removing the file as the last resort; the Mac app shows a link that stopped by itself, in the link's words."
