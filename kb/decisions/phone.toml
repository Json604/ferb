[PHN-304]
title = "Control and bulk never share a queue"
by = "agent"
date = 2026-11-10
status = "active"
rule = "Each call is its own QUIC stream at raised priority; bulk travels on its own lowered-priority stream as 16 KiB chunks, each acknowledged, with at most shared_window (1) unacknowledged on the shared relay. Control frames are at most 64 KiB, refused at the header."
why = "P6/P11: one 1 MiB frame on a 64 kB/s relay delayed control 4.3 s (median); acknowledged chunks kept it at 147 ms."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/limits.toml LIM-4."
legacy = "ferb-phone-link@57b3f34 LIM-4; lab paths: rust/src/wire.rs, rust/src/bridge.rs"

[PHN-305]
title = "No application ping; progress deadlines"
by = "agent"
date = 2026-11-10
status = "active"
rule = "The link sends no heartbeat of its own (QUIC's keep-alive only). A stream that makes no progress for stall_s (10) is reset; there is never a whole-frame deadline. A call unanswered after call_deadline_s + 5 shows reconnecting; the session is dropped only if a probe also gets no reply by give_up_after_s."
why = "P7: the lab's 2 s ping cost 292 B/s at rest against 23 B/s; a fixed frame deadline killed slow relay transfers."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/limits.toml LIM-5."
legacy = "ferb-phone-link@57b3f34 LIM-5; lab paths: rust/src/wire.rs::read_frame, rust/src/client.rs"

[PHN-306]
title = "Shared-relay bulk caps (defaults)"
by = "agent"
date = 2026-11-10
status = "superseded"
rule = "Defaults on the shared relay: one transfer 1 MiB; one preview picture 200 kB, at most every 5 s, never the live kind; a bulk budget of 1 MB a minute with a 2 MB burst, both directions; a daily bulk total of 100 MB. Control calls are never counted or delayed by any of them. The owner confirms the numbers (T-2)."
why = "n0's limit is unpublished and its relays are free shared servers."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/limits.toml LIM-6. Lab evidence: Validation 2026-11-10: n0's rate-limit notice arrived inside a 4 MiB burst, then control p50 0.9 s; 100-300 kB took 0.4-0.5 s. Here 2026-11-10: all basics through n0 relayed 103 kB, 0 notices."
superseded_by = "PHN-444"
legacy = "ferb-phone-link@57b3f34 LIM-6; lab paths: rust/src/limits.rs::Limits"

