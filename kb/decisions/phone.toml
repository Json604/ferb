[PHN-110]
title = "The sealed path for a hidden answer"
by = "agent"
date = 2026-11-10
status = "active"
rule = "A hidden answer is chat.answer {approval_id, text} with an unlock proof whose signed text holds the question, its one-time challenge and only the SHA-256 of the value. The bridge forwards it straight to the daemon's own answer method, overwrites its copies, and never logs, stores, cuts or echoes it. The phone keeps it in a hidden field on a screen excluded from screenshots, stores it nowhere, and clears the field once sent. A phone without a lock key cannot answer one; a bare Yes or a correction never does."
why = "FERB rule 7: a secret reaches no model, trace, log or database; it is filled only through the sealed path."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/security.toml SEC-10."
legacy = "ferb-phone-link@57b3f34 SEC-10; lab paths: rust/src/bridge.rs, rust/src/daemon.rs, standin/daemon.py"

