[PHN-102]
title = "Pairing needs the QR's one-time secret and the owner's Yes"
by = "agent"
date = 2026-11-10
status = "active"
rule = "The QR carries a 256-bit one-time secret. The phone proves it with a keyed hash over both endpoint ids; the secret never crosses the wire. The window is pair_window_s (120), single use, ended by pair_wrong_max (3) wrong proofs. Only after a right proof does the Mac ask, naming the phone; the owner's Yes pairs it."
why = "P1: with the id-only QR a stranger got the prompt, blocked the real phone, and one click paired them."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/security.toml SEC-2."
legacy = "ferb-phone-link@57b3f34 SEC-2; lab paths: rust/src/pairing.rs, rust/src/bridge.rs"

