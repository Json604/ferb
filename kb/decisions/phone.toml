status = "superseded"
rule = "The app has one switch, Stay connected: an Android foreground service (type remoteMessaging, with its permanent notification) keeps the link up and posts FERB's questions as notifications. With it off, the link closes when the app leaves the screen and nothing dials. No push service is used; a hosted push sender is the owner's decision (T-6)."
