[PHN-4]
title = "Reaching a closed app: stay connected, no hosted push"
by = "agent"
date = 2026-11-10
status = "superseded"
rule = "The app has one switch, Stay connected: an Android foreground service (type remoteMessaging, with its permanent notification) keeps the link up and posts FERB's questions as notifications. With it off, the link closes when the app leaves the screen and nothing dials. No push service is used; a hosted push sender is the owner's decision (T-6)."
why = "P4: FCM and APNs need a sender holding a private key, so a server someone runs. A foreground service needs none."
rejected = ["A FERB-operated push server: not invented here", "Silent reconnect loops in the background: Doze stops them and they hammer the relay"]
