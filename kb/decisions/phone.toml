by = "agent"
date = 2026-11-10
status = "active"
rule = "role.rs lists every method of FERB's app role in one of four classes. Plain: forwarded. Private (shows the owner's data): needs a Mac-verified unlock within unlock_idle_s (300), which use extends. Sensitive (changes protection, settings, keys, memory, schedules, or what FERB may do; lifts a stop; installs an update): needs a signature by the phone's lock-bound key over this exact call and a fresh one-time challenge. Never: 11 methods, each with its reason (T-12). An unclassified method is refused; a test reads FERB's own table and fails when one appears."
why = "SEC-11's other half: a lost or borrowed unlocked phone must not be full control of the Mac."
rejected = ["A short allowlist (SEC-3): the owner wants everything", "Everything plain: an unlocked phone left on a table could change settings and keys"]
