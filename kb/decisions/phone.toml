[PHN-105]
title = "A Yes to FERB's own checks is signed by the phone's lock-bound key"
by = "agent"
date = 2026-11-10
status = "active"
rule = "For a question whose capability is one of FERB's own checks (questions.py OWN_CHECKS), anything but a plain No needs a P-256 signature over the exact answer and a one-time challenge, by a key the phone registered at pairing and can use only after a fingerprint, face or device credential. The Mac verifies it; a phone paired without such a key cannot give that answer."
why = "P3 and FERB rule 5: whoever holds the unlocked phone must not be the owner for a hard-to-undo Yes; a claim from the app is not proof."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/security.toml SEC-5."
