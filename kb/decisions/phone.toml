# Decisions of area `phone` (kb/areas.toml): the phone role, the link and the phone apps (ENG-1 stages 3-5).
# PHN-1..PHN-399 are imported from the phone lab (~/Desktop/ferb-phone-link at 57b3f34, read only): the lab's
# PHN-n keeps its number; the lab's SEC-n is PHN-(100+n), NET-n PHN-(200+n), LIM-n PHN-(300+n), because an area
# has one prefix. Text inside an imported record names the lab's own ids (SEC-, NET-, LIM-, T-, LIVE-); read them
# in the lab. The lab's paths and live checks are not carried (they name the lab's files); `legacy` names the
# lab record. PHN-401 and later are FERB's own records from 2026-11-16 on.

# ---- imported from the lab's kb/decisions/phone.toml (PHN-n -> PHN-1..)

[PHN-1]
title = "One Rust crate is both sides; phone apps use three calls"
by = "agent"
date = 2026-11-10
status = "superseded"
rule = "The link is one Rust crate on stock iroh 1.4.1 from crates.io. The Mac bridge is a binary of it. Phone apps load it as a native library with three JSON-text calls (start, command, poll) through plain JNI or C; there is no iroh-ffi, no generated binding and no fork."
why = "P9: the research needed a patched iroh-ffi (network change) and a forked iroh core (relay policy). Calling iroh from our own Rust needs neither."
rejected = ["iroh-ffi 1.2.0 + patches: rebuilt per platform on every upgrade", "Swift + iroh-ffi on the Mac: two implementations of one protocol", "Python iroh 1.2.0 in the daemon: an older binding"]
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/phone.toml PHN-1."
superseded_by = "PHN-446"
legacy = "ferb-phone-link@57b3f34 PHN-1; lab paths: rust/src/ffi.rs"

[PHN-2]
title = "Redial with backoff and stop conditions"
by = "agent"
date = 2026-11-10
status = "active"
rule = "The phone redials after 1, 2, 4, 8, 15, 30, 60 s, then every 60 s, each with 20 % jitter; after 10 minutes of failing every 5 minutes. It resets after a 60 s healthy session, dials once at a network change, obeys retry_after_s, never dials in the background unless told to stay connected, and stops for errors a redial cannot fix."
why = "P7: the lab redialed every second for ever."
evidence = "Imported from ferb-phone-link@57b3f34 kb/decisions/phone.toml PHN-2."
legacy = "ferb-phone-link@57b3f34 PHN-2; lab paths: rust/src/client.rs::Backoff"

