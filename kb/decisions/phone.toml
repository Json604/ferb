[PHN-830]
title = "How the Mac checks a phone's account at pairing: a server-signed assertion, verified by the daemon"
by = "agent"
date = 2026-11-24
status = "active"
rule = "For PHN-828. The phone gets a 5-minute assertion from /api/app/assertion: ECDSA P-256 by a key only Vercel holds over {kid, aud ferb-pair, sub = account id, email, dev = its link endpoint, iat, exp}. It rides the pairing hello; the link helper only forwards it (PHN-124). Before asking the owner the daemon checks kid (pinned in its source), signature, aud, expiry and dev, then compares sub with the Mac's account: account_mismatch, mac_signed_out or account_unconfirmed. Nothing at run time adds a key. Phone rows keep their account id; a Mac account change removes the others."
why = "The phone can't be trusted to say which account it has (PHN-124): only a statement the server signed, bound to this phone's link identity and minutes old, proves it. P-256 because the engine already verifies phone proofs with it (no new dependency)."
paths = ["engine/crates/ferb-daemon/src/phone", "engine/crates/ferb-link/src", "engine/crates/ferb-mobile-ffi/src/link.rs", "engine/runtime/store/migrations", "site/api/app"]
