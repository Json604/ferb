by = "agent"
date = 2026-10-30
status = "active"
rule = "A browser payment's Yes is keyed to its tab chain (the first task tab that opened it). A Mac app's payment is scoped to its app window (bundle + window id) for 10 minutes; a payment with neither asks every run, showing an unread amount unless the capability describes it. The worker's declared amount is never shown or keyed. Bank page = the tab moved to another host, or the input is in a frame of another host (a payment gateway's card frame too: only a differing amount/merchant asks there)."
paths = ["ferb/policy/payments.py"]
legacy = "notes/gateway.md Rulings (step 6b): one payment, one question (scope)"

[GATE-217]
title = "When a payment is complete, and how amounts compare"
by = "agent"
date = 2026-10-30
status = "active"
rule = "Complete (next payment asks): a call ran on another host and the chain came back to the checkout's host; a second card form is submitted there; or a one-click paying submit with no card form or bank page before it. Amounts compare by currency and number (a side with no currency compares the number); merchants case- and space-insensitively; an amount read where the approved one was unread asks again. Approvals live in memory (a restart asks again); a No is keyed by chain + amount + merchant and stays final."
why = "Residual: a one-click script button (no submit fact) can't be told from the same payment's later clicks, so a second identical order there within 10 minutes isn't asked again."
paths = ["ferb/policy/payments.py"]
legacy = "notes/gateway.md Rulings (step 6b): one payment, one question (completion)"

