[GATE-505]
title = "Listed places in other apps' containers are never looked at"
by = "agent"
date = 2026-11-02
status = "active"
rule = "A protection-list entry that is another app's container or inside one (~/Library/Containers/<id>, ~/Library/Group Containers/<id>, as typed or under those folders resolved) is never stat'ed, resolved or opened: its resolved form is the containers folder resolved plus the rest as written, it counts as a folder for the shell profile, and a folder above it inside a container is denied as present. The containers folders themselves may be looked at. Paths a tool call names are still checked as the kernel reaches them."
why = "T-503: touching another app's container without Full Disk Access is refused and macOS 27 posts \"was blocked from accessing data\"; every daemon start and shell command resolved each never-read entry, Safari's container among them (listed from 2026-11-01, d9ee6bb4)."
