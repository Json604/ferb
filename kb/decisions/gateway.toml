date = 2026-11-04
status = "active"
rule = "The browser and Mac typing tools record a typed email address or phone number as the call's recipient (provenance.typed_destination), never a URL: a URL addresses no one. Typed into a field it is data; opening it is navigation, which the browser URL sink and the foreground and browser-page questions cover. Typed emails and phone numbers keep the S4(b) provenance question at typing time, because a browser send (a JS Send button) has no structural fact (act_kind is physical only; T-201) and the typing is the only structural point where an injected recipient is seen."
why = "Audit G4: 5 of 13 typed-value questions were URLs (LinkedIn profiles, a visa site, chrome://extensions, which the browser-page question covers on its own). Moving the email/phone check to send time was weighed and rejected: it would depend on the worker's declaration and so weaken rule 9."
rejected = ["Asking only at the send for typed emails and phones (declaration-dependent for browser sends)", "Exempting fields whose autocomplete says email or tel (an injected recovery address would go unasked)"]
paths = ["ferb/policy/provenance.py::typed_destination"]
