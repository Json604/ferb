# Decisions of area `gateway` (kb/areas.toml).

[GATE-500]
title = "A secret pasted into the chat is masked and FERB says revoke it"
by = "owner"
date = 2026-11-01
status = "superseded"
superseded_by = "GATE-501"
words = "\"for secrets, have a list of secret patterns and a code check on every request; if they match, add a line: you may have leaked the secret in chat, revoke it\", \"or if we can mask it\""
rule = "Every chat request is checked by code against a list of secret patterns; on a match the secret is masked and FERB adds a line saying it may have leaked in the chat and should be revoked."
