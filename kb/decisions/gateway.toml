[GATE-548]
title = "Why FERB keeps secrets through its own small signed helper, and what that does not stop"
by = "agent"
date = 2026-11-08
status = "active"
rule = "A Keychain item trusts the binary that created it. Created by FERB's Python, which runs any script, that trust would be wide; created by `security`, any program running it reads the item. So one small pinned, signed helper (ferb-secrets) creates and reads FERB's items: generic tools now get a Keychain prompt. Limits: the helper checks no caller, so any program running as the owner can ask it for a secret; FERB.app-only store/delete RPCs, the sandbox keeping models, tasks and the shell away from the Keychain and ~/.ferb, and no key in an environment, log or span are what is enforced."
why = "A caller check wouldn't stop a same-user program (it can run FERB's signed Python), and changing the helper's bytes asks again for every saved secret, so the helper stays as pinned (REL-404); hardening waits for its next planned change (T-1071)."
paths = ["ferb/identity/helper.py", "ferb/runtimes/keys.py"]
untestable = "The Keychain's access list and prompts: the owner's Mac only; tests use a fake Keychain and never the real one (TEST-508)."

