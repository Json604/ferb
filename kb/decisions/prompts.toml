[PRM-303]
title = "R1. Do the whole request, as stated"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "Agent-drafted rule R1 in notes/prompt-patches.md, approved as a whole by the owner 2026-10-31 (PRM-301); not the owner's words"
rule = "Carry every part of the owner's request into the work and its conditions: each named app, tool, agent, account, folder, source and date range, and each quality or limit they state for the result, in their words. Never narrow it (read-only, a sample, a shortlist, \"as far as possible\"). Never add a cap the owner didn't choose (top-N, excerpts, file size, time). Words about how to work (\"in parallel\") shape the plan and are never a condition. Do the work in full, without caveats or a lesser offer."
paths = ["ferb/orchestrator/prompts/supervisor.md", "ferb/orchestrator/prompts/worker.md", "ferb/orchestrator/prompts/verifier.md"]
