# Decisions of area `prompts` (kb/areas.toml). Moved from notes/prompts.md and notes/prompt-patches.md on 2026-11-02
# (batch C). The prompt files are executable input: they change only through these decisions (a correction goes to
# FERB's memory, never into a prompt). The owner decisions there were written as an agent's paraphrase, so most carry
# `words_source` instead of `words`.

[PRM-300]
title = "Patches leave the prompts; a correction goes to memory, never into a prompt"
by = "owner"
date = 2026-10-30
status = "active"
words = "most of these are my specific things the model should remember"
words_source = "notes/prompts.md owner decision 2: the quote is the owner's; the sorting and method around it are an agent's paraphrase"
rule = "Incident patches leave the prompts, sorted three ways: facts and preferences about the owner become owner-confirmed memory items; general behavior lessons become one general rule each in the right prompt; how one tool behaves goes into that tool's description or goes. A removed patch's original task joins the live re-test list. From then on a correction goes to FERB's memory (\"remember ...\"), never into a prompt."
paths = ["ferb/orchestrator/prompts"]
legacy = "notes/prompts.md decision 2; target design 5"

[PRM-301]
title = "The approved patch table: general rules R1-R10 and the owner's memory items"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/prompts.md owner decision 4 (approving notes/prompt-patches.md): an agent's paraphrase; the owner's quoted words for M1 are personal and kept in kb/local"
rule = "The ten general rules R1-R10 replace the prompt patches. The approved memory items M1-M9 are stored as the owner's confirmed words, M7 and M8 found by search and the rest in the core profile; \"email me\" means the owner's own address, stored as a memory item. \"anytime\" means FERB picks a time from context and says which (R10). FERB's inferred duplicates of these items are dropped. The items are seeded once on the new build's first start (journaled, idempotent), since the live store is never written by hand."
paths = ["ferb/orchestrator/prompts", "ferb/memory/profile.py::SEARCH_ONLY_KIND"]
legacy = "notes/prompts.md decision 4"

[PRM-302]
title = "Default browser profile: FERB's own"
by = "owner"
date = 2026-10-31
status = "active"
words_source = "notes/prompts.md owner decision 5 (answering notes/prompt-patches.md call 6): an agent's paraphrase; no verbatim quote recorded"
rule = "Ordinary web work with no profile named uses FERB's own profile (identity \"ferb\"); the owner's profiles only when the task or memory needs their accounts. The stored fact naming the owner's browser profile that holds most of their accounts says where accounts are, not a default."
paths = ["ferb/orchestrator/prompts/supervisor.md"]
legacy = "notes/prompts.md decision 5"

[PRM-313]
title = "A prompt is a contract"
by = "agent"
date = 2026-10-30
status = "active"
rule = "A role prompt holds the role, what each output field means and the judgment only the model can make. Anything code enforces is at most one line of fact (\"code asks the owner about payments...; never ask yourself\")."
why = "2026-10-30: a worker's first turn was ~85% instructions and tool text, and rules for code-enforced behavior contradicted the code."
paths = ["ferb/orchestrator/prompts"]
legacy = "notes/prompts.md target design 1"

[PRM-314]
title = "Tool manuals live in tool descriptions; tool-less roles see no tools"
by = "agent"
date = 2026-10-30
status = "active"
rule = "How one tool behaves is written in that tool's description, shown only when the tool is offered; no context block repeats the tool catalog. The effect/destination contract is written once in the worker's instructions, and each acting tool's fields carry a one-line pointer to it. Roles without tools get no catalogs or tool-fetch lines."
why = "2026-10-30: the catalog went twice to the worker and checker (native schemas plus a ~38k copy), and tool-less roles were told to use tools."
paths = ["ferb/daemon/areas/environment.py", "ferb/orchestrator/supervisor.py::TOOLLESS_ROLES"]
legacy = "notes/prompts.md target design 2; fix list"

[PRM-315]
title = "One small shared prefix; role blocks only when a run needs them"
by = "agent"
date = 2026-10-30
status = "active"
rule = "Every role gets one small shared prefix (interaction.md: trust, voice, background first, and rules R2, R5, R10); worker method rules go only to the worker. Role blocks (prompts/roles/: step, inputs, proposals, converse, watch, loop, parts, scheduled) are appended by code with the matching report schema only when a run needs them."
paths = ["ferb/orchestrator/prompts/interaction.md", "ferb/orchestrator/prompts/roles", "ferb/orchestrator/supervisor.py::Supervisor._report_roles"]
legacy = "notes/prompts.md target design 3, 4"

