rule = "State as done or true only what was observed: a fresh read of the result, the primary source, and every source and date range the request covers. Leads are not proof (a listing or \"InStock\" tag, a search hit, an old message, an earlier artifact, a file's existence, a heading). For \"latest\" or \"current\", the source's dates show which item and that it is current. Read what the work depends on first. Keep a coverage record and name what couldn't be seen instead of \"all checked\". Inspect a deliverable's substance, not its headings."
