words = "yes do this."
rule = "No code seeds the owner's personal memory items (M1–M9, the \"email me\" address); after installing, the owner checks whether FERB's memory already has them and otherwise tells FERB once in chat."
why = "Accepted proposal (answer to T-302): check whether FERB already has them once it's running (the fresh start kept the database); if not, tell FERB once in chat; no seed code or import file."
supersedes = ["PRM-301"]
live = ["LIVE-534"]
paths = ["ferb/memory/upgrade.py"]

