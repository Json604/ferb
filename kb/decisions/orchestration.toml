words_source = "notes/memory.md owner decision 10 (reversing an earlier yes): an agent's paraphrase; no verbatim quote recorded"
rule = "The planner is one fast call that changes nothing until it returns and has no lookup tools. It gets Tier 1 and retrieved memory pushed into its context; a reply that needs more becomes a task, whose worker has memory.read, chat.history, task.evidence and trail.query. Revisit if exposure records show planner memory misses."
