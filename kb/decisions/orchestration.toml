rule = "For ORCH-305's fit check. A worker is handed its inputs as paths and reads them with its tools; code never puts a file's content in its context, and fs.read returns UTF-8 text only. So the inventory counts a file's bytes as its token upper bound only when it is text: its first TEXT_PROBE (8,192) bytes hold no NUL and are UTF-8 (a structural fact, never its name or extension). Any other file (a video, a photo, a binary PDF) counts 0 and is marked text: false in the measured inventory. A file FERB can't open counts its bytes."
