# Decisions of area `orchestration` (kb/areas.toml). Moved from notes/memory.md on 2026-11-02.

[ORCH-1]
title = "The planner stays tool-less; workers do the lookups"
by = "owner"
date = 2026-10-30
status = "active"
words_source = "notes/memory.md owner decision 10 (reversing an earlier yes): an agent's paraphrase; no verbatim quote recorded"
rule = "The planner is one fast call that changes nothing until it returns and has no lookup tools. It gets Tier 1 and retrieved memory pushed into its context; a reply that needs more becomes a task, whose worker has memory.read, chat.history, task.evidence and trail.query. Revisit if exposure records show planner memory misses."
why = "Lookups would add model round trips that each re-send the whole context, need the worker tool path in supervisor mode, complicate reply streaming and hold the chat longer."
rejected = ["Lookup tools for the planner (an earlier yes, reversed 2026-10-30)"]
paths = ["ferb/orchestrator/supervisor.py::TOOLLESS_ROLES", "ferb/orchestrator/prompts/supervisor.md"]
legacy = "notes/memory.md decision 10"

[ORCH-500]
title = "The intro's preview is a plan-only run that cannot act"
by = "agent"
date = 2026-11-01
status = "active"
rule = "intro.preview runs the real planner turn alone (Supervisor.preview): no run token, no worker, no task row, no chat entry; every event (plan, one part per planned step, done) carries preview: true. Its context leaves out the owner's live state (running tasks, open questions, earlier chat, notices, schedules, reminders) and keeps the capability facts, recalled memory and today's activity, as a real plan would use. Its session prefix `preview:` is reserved, so chat.send refuses it. FERB.app only."
why = "The intro's \"it never acts\" holds by construction, not by instruction (AGENTS.md rule 3)."
paths = ["ferb/orchestrator/supervisor.py::Supervisor.preview", "ferb/orchestrator/continuity.py::RESERVED_SESSIONS", "ferb/daemon/areas/intro.py"]
live = ["LIVE-500"]
legacy = "notes/setup-intro.md Left to the builder (Task 4); notes/setup-intro-plan.md Task 4"
