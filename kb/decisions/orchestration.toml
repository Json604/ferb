[ORCH-541]
title = "A detail the records contradict never stands unmarked: no removal or mark is a retry"
by = "agent"
date = 2026-11-05
status = "superseded"
rule = "When the checker finds FERB's report condition false and no edit removed or marked anything, the attempt is a retry told the checker's evidence (journaled: task.report_condition_unmet, retry: true); with a removal or mark applied it is accepted (ORCH-540). The retry counts toward ORCH-307's check-in; when attempts run out on it (nobody attends, or the owner's No), the latest answer stands done_unverified with code's own \"Couldn't confirm\" line, never the checker's evidence. Its waiting step saves that answer, so a restart's check-in ends the same way."
why = "ORCH-540 kept the checker's evidence out of the answer, which left a detail the records contradict standing unmarked when no edit applied, against ORCH-309 (owner): \"FERB never states unseen things as fact\". The owner accepted retries for the report condition with P4."
paths = ["ferb/orchestrator/supervisor.py::Supervisor._next", "ferb/orchestrator/supervisor.py::Supervisor._report_unconfirmed", "ferb/orchestrator/supervisor.py::Supervisor._restored"]
