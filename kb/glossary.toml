# Terms a newcomer (person or agent) can't decode from the code alone.
#
# ["sink rule"]
# meaning = "Data read from outside never flows to a send without the owner's Yes."
# see = ["GATEWAY-4"]

["Tier 1"]
meaning = "The core profile: what FERB knows about the owner, always in every role's prompt within a fixed budget; code renders each entry word for word from its fact."
see = ["MEM-5", "MEM-7", "MEM-17"]

["holds up"]
meaning = "When FERB's own understanding or an observed fact has earned a place in Tier 1: seen on two separate days, or standing 7 days uncorrected."
see = ["MEM-15", "MEM-18"]

["how-note"]
meaning = "The short \"how I did it\" note on a verified episode, retrieved for similar requests."
see = ["MEM-1", "MEM-31"]

["playbook"]
meaning = "One merged how-note for several verified runs of the same kind of work, rewritten as new runs succeed."
see = ["MEM-29"]

["set aside"]
meaning = "An owner fact FERB stopped using because it looks over; kept as history and restored when the owner says it still holds."
see = ["MEM-14", "MEM-32"]

["Jev"]
meaning = "The paid outside service that decided which perception events matter (notices); switched off by default."
see = ["SENSE-2", "SENSE-3"]

["daily distill"]
meaning = "The once-a-day model pass over the day's chat and activity that saves durable facts and retires stale ones."
see = ["MEM-8", "MEM-22"]

["APP_ONLY"]
meaning = "The daemon methods only FERB.app's own process may call, checked by code signature (auth.APP_ONLY); any other program running as the owner gets \"FERB.app only\"."
see = ["DMN-23", "DMN-27"]

["developer toolbox"]
meaning = "The `ferb` commands kept only for debugging (trace, logs, stats, doctor, memory, restore, ps, verdict, runtimes, browsers); never presented to users."
see = ["DMN-3", "DMN-4"]

["FERB's home"]
meaning = "~/.ferb: FERB's own folder (config, database, logs, venv or links into FERB.app) and the daemon's working folder."
see = ["DMN-14", "STORE-1"]

["report relay"]
meaning = "The owner's Cloudflare Worker (relay/) that turns a failure report Send into one issue plus one file in the private reports repo."
see = ["DMN-8", "DMN-30"]

["visible folders"]
meaning = "The owner's own places terminal commands can't change unless named: non-hidden folders and files in home, iCloud Drive, /Volumes."
see = ["HAND-203", "HAND-215"]

["borrowed tab"]
meaning = "An owner tab FERB works in: never grouped, muted, moved or closed by FERB, and left where the work finished."
see = ["HAND-201", "HAND-229"]

["P19"]
meaning = "The repeat check: an action whose outcome is unknown can't run again unasked; its identity comes from stable targets, not snapshot ids."
see = ["HAND-220", "HAND-225"]

["lift"]
meaning = "Lifting a protection rule for a task after the owner's Yes: reads once per protected folder per task, writes per command."
see = ["GATE-200"]

["escape hatch"]
meaning = "A shell command run with a protection rule lifted after the owner's Yes; FERB state, its service definitions and the network rule are never lifted."
see = ["HAND-217"]

["sink rule"]
meaning = "The owner's private data never goes, after outside content was read, to a destination the owner neither named nor approved without the owner's Yes."
see = ["GATE-205", "GATE-215", "GATE-218"]

["Need"]
meaning = "One question a call may require (protection, payment, sink, foreground, terminal...), produced by the gateway and asked in its one find/ask/record/claim step."
see = ["GATE-202", "GATE-221"]

["tab chain"]
meaning = "A task tab and every tab or popup it opened; one payment's Yes covers its chain only."
see = ["GATE-204", "GATE-216"]

["known destination"]
meaning = "A recipient or site the owner approved, or a site named in a request; approved ones pass the sink rule, any known one passes the new-recipient check."
see = ["GATE-205", "GATE-218"]

["routine questions"]
meaning = "The questions a \"don't ask for 30 minutes\" answer covers: foreground, protected-folder reads, a browser's own pages, new recipients, profile pairing."
see = ["GATE-207"]

["operational records"]
meaning = "FERB's bookkeeping about doing a task (action ledger, confirmations, plans, loop state, timer deliveries, operational journal kinds), deleted 90 days after the task or timer ends."
see = ["STORE-401", "STORE-404", "STORE-408"]

["the clean-up"]
meaning = "The one-time, owner-confirmed setup step (`ferb setup --cleanup`, Settings → Data → Clean up) that empties dead tables with the daemon stopped and compacts the database."
see = ["STORE-402", "STORE-412"]

["exchange"]
meaning = "One owner message (or several read together) and FERB's reply to it; the unit the planner's recent conversation counts."
see = ["ORCH-303", "ORCH-318"]

["part"]
meaning = "One of the owner's asks in a message (not a plan step); each gets its own row in the turn card and posts once."
see = ["ORCH-319", "APP-300"]

["answer step"]
meaning = "The one plan step whose checked answer answers a part; a summing-up step is refused."
see = ["ORCH-319"]

["check-in"]
meaning = "FERB's \"keep going?\" question after 5 failed attempts at a task or plan step."
see = ["ORCH-307"]

["standing send"]
meaning = "A scope the owner approved for sending to recipients FERB finds itself, including in unattended runs."
see = ["ORCH-306"]

["unattended run"]
meaning = "A run with no owner to ask (a scheduled run): it declines at once where an attended run would pause and ask."
see = ["ORCH-307", "ORCH-323"]

["typed card"]
meaning = "A structured card (reminder, event, note, payment, send, link, file) built from FERB's own records and drawn by the notch next to the answer."
see = ["ORCH-329", "ORCH-321"]

["prompt patch"]
meaning = "A one-off line added to a runtime prompt after an incident; patches were removed in step 10b and corrections now go to memory."
see = ["PRM-300", "PRM-319"]

["shared prefix"]
meaning = "The small block every role's instructions start with (interaction.md: trust, voice, background first, R2, R5, R10)."
see = ["PRM-315"]

["role block"]
meaning = "A short prompt file in prompts/roles/ that code appends to the worker's instructions only when a run needs it (step, loop, watch, parts, scheduled...)."
see = ["PRM-315"]

["watch"]
meaning = "A schedule that checks something outside FERB's own work (\"tell me when X\") and survives restarts; never a loop or sleep inside a task."
see = ["PRM-311"]

["R1-R10"]
meaning = "The ten general prompt rules that replaced the incident patches (PRM-303 to PRM-312)."
see = ["PRM-319", "PRM-303", "PRM-312"]

["beat"]
meaning = "One step of the first-run intro tour (meet, signIn, permissions, browsers, identity, tryIt, control, home); IntroPlan picks which beats an install gets."
see = ["APP-505", "APP-517"]

["orb"]
meaning = "The small glass orb that drips off the notch in the intro, flies to the place FERB is pointing at, docks beside System Settings with the drag card, and melts back."
see = ["APP-501", "APP-534"]

["compact window"]
meaning = "The plain setup window that shows only the required setup steps still missing (service, sign-in, permissions); used after a skip and for repairs, never the tour."
see = ["APP-516"]

["sound logo"]
meaning = "FERB's full signature sound (the Open-fifth motif in Crystal glass), played only in the tour; every everyday cue is cut down from it."
see = ["APP-641", "APP-530"]

["Crystal"]
meaning = "The decided sound family: modal-synthesised bright glass for good news, the same glass finger-damped for paused and error."
see = ["APP-524", "APP-530"]

["needs you"]
meaning = "The sound and state for a wait on the owner (a question, an approval, a human check handed over); the loudest everyday cue."
see = ["APP-531"]

["Standard / Subtle"]
meaning = "The two intensities every everyday sound is rendered in; Standard is the default, Subtle the choice in Settings and the level used during calls."
see = ["APP-526", "APP-528"]

["Quiet notch"]
meaning = "The native macOS direction for the notch UI the owner approved on 2026-10-10: one compact composer, native controls, one live status line."
see = ["APP-572", "APP-573"]

["yield"]
meaning = "FERB.app ordering its notch windows out while another app's menu, picker or window needs the space, and back in exactly as they were when the reason is gone."
see = ["APP-559", "APP-560"]
