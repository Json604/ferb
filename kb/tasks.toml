[T-1064]
title = "Hover can give FERB keyboard focus while the owner types a password elsewhere"
area = "app"
kind = "question"
status = "open"
why = "Security run T-1058: hover (on by default) opens FERB and makes its panel key (PanelCoordinator.focusVisibleInput); nothing in ui/ checks IsSecureEventInputEnabled, so the rest of a password being typed elsewhere can land in FERB's composer. Window mode and the shortcut are unaffected."
decisions = ["APP-745", "APP-740"]
ask = "While you're typing into a password field somewhere, should hovering over FERB open it without moving your typing into FERB (you'd click its box to type)?"
