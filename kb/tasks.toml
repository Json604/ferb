area = "gateway"
kind = "question"
status = "open"
why = "Security run T-1058: GATE-214 needs cc-* fields in the submitted form itself (Gateway._fact_targets, content.js submitInfo). A card frame from another origin, a saved-card Buy now, an amount-only donation form and a wallet button raise no payment fact. Signals and costs: the T-1058 report."
decisions = ["GATE-202", "GATE-204", "GATE-214", "GATE-216", "GATE-217"]
ask = "Should a card field filled anywhere in the tab (a payment provider's card frame too), an amount field (autocomplete transaction-amount) in a submitted form, and input on a known payment provider's frame or page each count as a payment that asks you? Cost: an extra question when FERB saves a card in a site's settings or opens a PayPal or Google Pay frame without paying."

[T-1061]
title = "A typed answer approves every address in it for good, pasted text included"
area = "gateway"
kind = "question"
status = "open"
why = "Security run T-1058: Gateway._ask_owner records every email, URL host and 6+ digit run in a typed or pasted answer as `answered` (approved for good, GATE-218); a correction records the same words only as `named`. Batch 3b's boxes and routed chat words land there. Evidence: the T-1058 report."
decisions = ["GATE-205", "GATE-218", "ORCH-518"]
ask = "When you type or paste an address in an answer (rather than pick it from FERB's options), should it count like an address in your request (used freely, but FERB asks once before sending your private data there after reading outside content) instead of approved for good?"

[T-1062]
title = "Words typed in a task question's box are hidden whole when the question mentions a password"
area = "gateway"
kind = "question"
status = "open"
why = "Security run T-1058: chat.answer hides the whole typed answer when the question has a password word (labels.hidden_answer, reply=False). Since ORCH-536 every option question has a box, so a sentence reaches the worker as \"[redacted]\" with no FERB note. The safety check's box uses the one-word rule."
decisions = ["GATE-501", "GATE-502", "ORCH-536"]
ask = "When a task's question mentions a password and offers buttons, should words you type in its box be hidden from the AI only when they look like a password (one word), so a sentence like \"yes but use the work email\" reaches the task? Today the whole sentence is hidden."

[T-1063]
