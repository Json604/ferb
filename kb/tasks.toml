[T-201]
title = "Native apps: find a structural source for pay, account-security and send facts"
area = "gateway"
kind = "build"
status = "open"
why = "In native apps these questions still rest on the worker's declaration (GATE-202): the only cheap pre-call Accessibility fact is a secure field, which can't tell a sign-in from a password change; no card, amount or recipient markup. Needs a structural source first."
