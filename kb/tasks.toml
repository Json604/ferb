kind = "question"
status = "open"
why = "Security run T-1058: ext_bridge _TabDriver._leftover puts `account` in the record kept in the task.cleanup span, tasks.outcome_json resources, the outcome event and chat.status. HAND-424 says read fresh, never stored or journaled; the answer line shows it by design."
