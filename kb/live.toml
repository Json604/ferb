# Live (manual) checks: things only a person can verify on the real product. The result is the owner's verdict.
#
# [LIVE-1]
# title = "Sign in survives a deploy"
# area = "auth"
# surface = "staging, the owner's test account"
# request = "Sign in, deploy, reload the page"
# pass = "Still signed in; no second login prompt"
# decisions = ["AUTH-3"]
# sitting = "1"
# result = ""           # "passed 2026-11-05 v1.4.0" or "failed 2026-11-05: T-14"
# waiver = ""           # the owner's reason to skip it for a release

[LIVE-1]
title = "FERB gets better at a repeated task"
area = "memory"
surface = "FERB.app on the owner's Mac, an owner-controlled task (e.g. a kartikey.xyz page or FERB's Gmail)"
request = "Ask FERB to do the same kind of task twice, on different days or after the first is verified; then open `ferb stats` (Repeated work) or memory.repeats."
pass = "The second run takes fewer attempts or less time, its context exposures cite the first run's how-note or playbook, and the playbook appears on the Memory page."
decisions = ["MEM-1", "MEM-29", "MEM-31", "MEM-33"]
sitting = "step 13"

[LIVE-2]
title = "The embedding model's first fill on the owner's store"
area = "memory"
surface = "FERB.app build with the bundled model, installed by the owner over their existing store"
request = "Install the build, let the daemon run for a few minutes, then ask about something said in an old chat in other words."
pass = "The journal shows one `memory.embedded` backfill with counts and CPU seconds, no turn waits on it, and the old exchange is found by meaning."
decisions = ["MEM-6", "MEM-25", "MEM-26"]
sitting = "step 13"

[LIVE-500]
title = "Fresh install: the whole intro"
area = "app"
surface = "A FERB.app build the owner installs as a fresh install; also a notchless Mac or a second display"
request = "Run the intro through all eight beats. Quit at Screen Recording and reopen; skip once mid-flight; run it with Reduce Motion on and with sound off; on a notchless Mac or FERB's second display; then Replay intro from Settings and take \"Do it for real\" once."
pass = "The beats run in order and the Try beat acts on nothing; reopening lands on the same beat with the same grants; a skip leaves no orb or sound and the compact window shows only the required steps left; Reduce Motion fades the orb in place; everything reads with sound off; the orb starts at the virtual notch; Replay runs every beat; the real task starts only after Home."
decisions = ["APP-505", "APP-510", "APP-513", "APP-516", "APP-518", "ORCH-500"]
sitting = "1"

[LIVE-501]
title = "Living with FERB's sound family"
area = "app"
surface = "FERB.app on the owner's Mac in daily use, and 2-3 beta friends' Macs"
request = "Use FERB daily for about a week with the default sounds, including one call in another app; ask each friend to say what each sound means without looking at the screen."
pass = "Each sound is matched to its meaning without looking, none annoys by the tenth hearing, summon and paused stay silent by default, and during the call only needs you plays, at Subtle."
decisions = ["APP-520", "APP-526", "APP-528", "APP-531"]
