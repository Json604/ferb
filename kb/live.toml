[LIVE-26]
title = "Reinstalling over leftovers, including another FERB.app's registration"
area = "daemon"
surface = "A disposable install (another macOS user) with an older FERB's files, one deliberately broken file and a registration from a FERB.app at another path"
request = "Install and open the new FERB.app over it."
pass = "FERB starts; the broken file is moved aside as <name>.broken-<time> and told once in the chat; intact data is used as is; this app's service registers over the other path's."
decisions = ["DMN-10", "STORE-1", "STORE-2"]
sitting = "step 13"
