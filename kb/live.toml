[LIVE-25]
title = "FERB's icon looks right everywhere on the Mac"
area = "release"
surface = "A FERB.app build and its DMG installed by the owner"
request = "Look at FERB in the Dock, Finder, Launchpad, Login Items, notifications, the DMG volume and the site's favicon."
pass = "The dark rounded square with the white \"f\" and orange dot everywhere; on macOS 26+ it doesn't sit in a grey frame."
