# Live (manual) checks: things only a person can verify on the real product. The result is the owner's verdict.
#
# [LIVE-1]
# title = "Sign in survives a deploy"
# area = "auth"
# surface = "staging, the owner's test account"
# request = "Sign in, deploy, reload the page"
# pass = "Still signed in; no second login prompt"
# decisions = ["AUTH-3"]
# sitting = "1"
# result = ""           # "passed 2026-11-05 v1.4.0" or "failed 2026-11-05: T-14"
# waiver = ""           # the owner's reason to skip it for a release

[LIVE-1]
title = "FERB gets better at a repeated task"
area = "memory"
surface = "FERB.app on the owner's Mac, an owner-controlled task (e.g. a kartikey.xyz page or FERB's Gmail)"
request = "Ask FERB to do the same kind of task twice, on different days or after the first is verified; then open `ferb stats` (Repeated work) or memory.repeats."
pass = "The second run takes fewer attempts or less time, its context exposures cite the first run's how-note or playbook, and the playbook appears on the Memory page."
decisions = ["MEM-1", "MEM-29", "MEM-31", "MEM-33"]
sitting = "step 13"

[LIVE-2]
title = "The embedding model's first fill on the owner's store"
area = "memory"
surface = "FERB.app build with the bundled model, installed by the owner over their existing store"
request = "Install the build, let the daemon run for a few minutes, then ask about something said in an old chat in other words."
pass = "The journal shows one `memory.embedded` backfill with counts and CPU seconds, no turn waits on it, and the old exchange is found by meaning."
decisions = ["MEM-6", "MEM-25", "MEM-26"]
sitting = "step 13"

[LIVE-400]
title = "The first start after an update migrates and purges once"
area = "storage"
surface = "FERB.app build installed by the owner over their existing store"
request = "Install the build, let it start, wait for the first hourly pass; then read the journal (`ferb logs` / timeline)."
pass = "Migrations applied, `store.upgraded` and the memory upgrade records journaled once each, no `retention.failed`; the first pass journals `retention.purged` and `trail.purged` (the accessibility backlog)."
decisions = ["STORE-400", "STORE-401", "STORE-403"]
sitting = "step 13"

[LIVE-401]
title = "The clean-up runs on the live store with the owner's OK"
area = "storage"
surface = "FERB.app Settings → Data → Clean up, on the owner's store"
request = "Open Clean up, read the list of what goes, press OK."
pass = "The daemon stops and comes back; `store.cleaned` and `store.compacted` journaled; the file near 1.7 GB; `ferb doctor` shows the database OK and no clean-up pending."
decisions = ["STORE-402", "STORE-411", "STORE-412", "STORE-416"]
sitting = "step 13"

[LIVE-402]
title = "The database file stays flat a day after the clean-up"
area = "storage"
surface = "the owner's ~/.ferb/ferb.db, read-only"
request = "A day after LIVE-401, read the file size, `PRAGMA freelist_count` and the WAL size."
pass = "File size about the same, freelist_count small (free pages handed back hourly), WAL under 64 MiB."
decisions = ["STORE-409"]
sitting = "step 13"

[LIVE-403]
title = "Non-ASCII evidence search and continued-task episodes"
area = "storage"
surface = "FERB.app, an owner-controlled task that reads Hindi text, then a follow-up on the same task"
request = "Run a task that reads a page with Hindi text, search its evidence for a Hindi word; continue the task with a follow-up and open its episode."
pass = "`task.evidence` finds the Hindi text; the continued task's episode shows its last run's result and is verified."
sitting = "step 13"

[LIVE-404]
title = "A timer set from a task shows as a timer and can be cancelled from chat"
area = "storage"
surface = "FERB.app notch"
request = "Ask for a task that sets a timer (`time.set_timer`), then cancel it from chat."
pass = "The notch shows a timer (not a reminder); the chat cancel removes it."
sitting = "step 13"

[LIVE-405]
title = "The planner injection test passes (P20)"
area = "runtimes"
surface = "the checkout after the rebuild, the owner's Codex sign-in"
request = "The owner runs tests/security/test_planner_injection_real.py once."
pass = "It passes; then planner caching becomes the default (T-405)."
decisions = ["RUN-401"]
sitting = "step 13"

[LIVE-406]
title = "Codex worker: FERB's base instructions and a long confirmation"
area = "runtimes"
surface = "FERB.app on Codex, an owner-controlled task (a kartikey.xyz page or FERB's Gmail)"
request = "Run a worker task; leave an owner confirmation it raises unanswered for more than 60 s, then answer. Compare one task's quality and tokens with an older run. Also `uv run pytest -m real tests/test_real_runtimes.py`."
pass = "FERB tools listed and called, typed answer returned, no `instructionSources`; the confirmation's call is not abandoned; the real tests pass."
decisions = ["RUN-407", "RUN-410"]
sitting = "step 13"

[LIVE-407]
title = "Codex planner and start: compaction off, overflow, no version subprocess, 90 s cut"
area = "runtimes"
surface = "FERB.app on Codex, the owner's journal and process list"
request = "After the owner installs the build, read the first start's journal; start a run and watch processes; send a planner prompt over ~245k tokens and one over the window; let a planner turn run past 90 s."
pass = "No `runtime.codex_problem`; no `codex --version` process per run; no `contextCompaction` item; the over-window prompt comes back as an overflow; the planner turn is cut at 90 s with a plain reply."
decisions = ["RUN-402", "RUN-406", "RUN-407"]
sitting = "step 13"

[LIVE-408]
title = "Claude SDK availability follows model and FERB's sign-in"
area = "runtimes"
surface = "FERB.app Settings → AI with FERB's own Claude sign-in (owner's subscription)"
request = "Clear the Claude model and look at the runtimes; set it again; then Sign out of Claude."
pass = "Without a model Claude shows unusable, the planner isn't offered it and `runtimes.check` fails naming the model; after sign-out Claude is unusable."
decisions = ["RUN-404", "RUN-409"]
sitting = "step 13"

[LIVE-409]
title = "Claude SDK runs: reshaped planner schema, big worker, hidden token, steering cost"
area = "runtimes"
surface = "FERB.app on the Claude SDK, an owner-controlled task; one owner-run `pytest -m real_claude`"
request = "A planner turn on the reshaped SUPERVISOR_SCHEMA; a worker with an output schema and many FERB tools; `ps` during it; steer a worker twice."
pass = "The plan streams; the worker runs (MCP tool schemas within the optional/union limits); no run token in `ps`; one result after the replays, and the run's cost equals Claude's final `total_cost_usd`."
decisions = ["RUN-408", "RUN-409"]
sitting = "step 13"

[LIVE-410]
title = "Anthropic API: planner schema accepted, unknown tool, prices"
area = "runtimes"
surface = "FERB.app with the owner's Anthropic API key"
request = "A planner turn on SUPERVISOR_SCHEMA; a worker that calls a made-up tool name; read the usage spans of a claude-haiku-5-5 run."
pass = "No \"too many parameters with union types\"; the answer maps back and a plan streams; the made-up tool gets a tool error and the worker goes on; haiku-5-5 spans carry a cost."
decisions = ["RUN-400", "RUN-408"]
sitting = "step 13"

[LIVE-411]
title = "Gemini API: schemas accepted, parallel same-tool calls paired"
area = "runtimes"
surface = "FERB.app with the owner's free Gemini key"
request = "A planner turn on SUPERVISOR_SCHEMA and a worker on WORKER_SCHEMA; a worker making two parallel calls to one tool."
pass = "No \"too many states\"; both parallel results are paired with the right calls."
decisions = ["RUN-400", "RUN-408"]
sitting = "step 13"

[LIVE-412]
title = "After the 2026-11-01 pin move: Codex over HTTP, Claude cache and effort"
area = "runtimes"
surface = "FERB.app build with Codex 0.166.0 and Claude Code 2.1.310"
request = "Run a Codex task and read its trace; run a Claude task twice and read the cache rates and the request's effort."
pass = "Codex runs go over HTTP and the tool catalog is observed (a WebSocket run would fail closed); Claude cache reads still happen without the prompt-caching-scope beta; no effort is sent unless asked."
decisions = ["RUN-405", "RUN-409"]
sitting = "step 13"
