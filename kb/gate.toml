# The repository's checks (tools/kb/gate.py). Levels: commit (staged changes, keep it fast) < push < release.
# Each check is `builtin = ...` or `run = "<shell command>"` (exit 0 = pass). Optional: `when = [globs]` runs it only
# when a changed file matches; `ci = false` skips it in CI (e.g. needs a Mac); `timeout` in seconds; `args`.
# `run` commands get GATE_LEVEL, GATE_BASE and GATE_FILES (a file listing the changed paths).

[gate]
base = "main"                 # the branch pushes are compared against
on_commit_failure = "block"   # block | warn  (kb/setup.toml commit_failure)
commit_budget_seconds = 30
decisions_trailer = "present" # off | present | all: commits touching governed files say which decisions
ci_require_trailers = true    # CI fails when a commit in the push skipped the hooks
# protected = ["tools/kb/**", "kb/gate.toml", ...]   # changes need a `Gate-change:` trailer and show in the audit

[[check]]
name = "kb registry"
level = "commit"
builtin = "kb_check"

[[check]]
name = "whitespace"
level = "commit"
builtin = "whitespace"

[[check]]
name = "secrets"
level = "commit"
builtin = "secrets"
# args = { skip = ["tests/fixtures/**"], extra = { "internal token" = "\\bint_[a-z0-9]{32}\\b" } }

[[check]]
name = "personal data"
level = "commit"
builtin = "personal"          # terms in kb/local/personal.txt (untracked) never enter tracked files

[[check]]
name = "forbidden files"
level = "commit"
builtin = "forbidden"         # .env, keys, kb/local/**, plus the size cap from kb/setup.toml
# args = { globs = ["vendor/**"], max_file_kb = 5120 }

[[check]]
name = "local stays local"
level = "commit"
builtin = "local_ignored"

# --- project checks (proposed 2026-11-02 from the survey; times measured on the owner's Mac) ---
[[check]]
name = "migrations are append-only"
level = "commit"
builtin = "append_only"
args = { globs = ["ferb/store/migrations/**"] }

[[check]]
name = "lockfile matches pyproject"          # 0.01 s
level = "commit"
run = "uv lock --check"
when = ["pyproject.toml", "uv.lock"]

[[check]]
name = "type check (mypy ferb/core)"         # 0.4 s
level = "commit"
run = "uv run mypy ferb/core"
when = ["ferb/**", "pyproject.toml"]

[[check]]
name = "imports, versions, extension minimum" # 8 s: every module imports; version files equal; extension >= minimum
level = "commit"
run = "uv run pytest -q -p no:cacheprovider tests/test_imports.py tests/test_release_checks.py"
when = ["ferb/**", "tests/**", "extensions/**", "scripts/**", "pyproject.toml", "uv.lock"]

[[check]]
name = "kb tool tests (historical paths)"     # ~3 s: throwaway git repositories (PROJ-509)
level = "commit"
# kb.py needs Python 3.11+ (tomllib), as tools/kb/run picks it
run = "for p in python3.14 python3.13 python3.12 python3.11 python3; do command -v $p >/dev/null && $p -c 'import tomllib' 2>/dev/null && exec $p -I -B tools/kb/test_kb_historical.py; done; echo 'needs Python 3.11 or newer' >&2; exit 1"
when = ["tools/kb/**", "kb/config.toml"]

[[check]]
name = "release tooling tests (scripts/tests)" # ~10-20 s: stdlib unittest, stubs for every signing tool (REL-426)
level = "push"
run = "/usr/bin/python3 -I -m unittest discover -s scripts/tests -t ."
when = ["scripts/**", "assets/**", "THIRD_PARTY_NOTICES.md", "package.json", "package-lock.json", "rust/packaging/**",
        "rust/Cargo.toml", "rust/crates/ferbd/src/**", "rust/crates/ferb-runtimes/src/**",
        "rust/crates/ferb-browser/src/**", "rust/crates/ferb-memory/src/embeddings.rs",
        "rust/crates/ferb-device/src/install.rs", "extensions/chromium/manifest.json", "ui/mac/FERBNotch/Info.plist",
        "ui/mac/FERBAgent/**", "ferb/**/*.md"]
timeout = 600

# The Python safety suite is no longer a push check (TEST-510, owner, 2026-11-13): the Rust engine replaces the
# Python daemon, and the suite's timing-sensitive tests failed three pushes in a row on code they do not test.
# Run it by hand while the Python sources remain: `nice -n 10 uv run pytest -q`.

[[check]]
name = "Swift tests (FERB.app)"              # ~20 s warm, minutes cold
level = "push"
run = "scripts/swift-test-gate.sh"   # names the failing tests last, where the gate shows them
when = ["ui/mac/FERBNotch/**"]
timeout = 1800

# --- Rust engine (area `engine`, ENG-1): only when rust/** changes; the Python and Swift checks stay as they are ---
[[check]]
name = "Rust format"                         # under 1 s
level = "commit"
run = "rust/gate.sh fmt"
when = ["rust/**"]

[[check]]
name = "Rust lint (clippy, warnings refused)"
level = "push"
run = "rust/gate.sh lint"
when = ["rust/**"]
timeout = 1800

[[check]]
name = "Rust foundation builds for iOS and Android"   # ENG-5: the engine crates, without the Mac platform crate
level = "push"
run = "rust/gate.sh portable"
when = ["rust/**"]
timeout = 1800

[[check]]
name = "Rust tests"
level = "push"
run = "rust/gate.sh test"
# ferb/: the runtime Markdown and migrations the engine reads; extensions/: ferb-browser tests/extension_version.rs
when = ["rust/**", "ferb/**", "extensions/**"]
timeout = 1800

[[check]]
name = "live checks recorded"
level = "release"
builtin = "live_checks"
