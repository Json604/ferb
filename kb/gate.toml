# The repository's checks (tools/kb/gate.py). Levels: commit (staged changes, keep it fast) < push < release.
# Each check is `builtin = ...` or `run = "<shell command>"` (exit 0 = pass). Optional: `when = [globs]` runs it only
# when a changed file matches; `ci = false` skips it in CI (e.g. needs a Mac); `timeout` in seconds; `args`.
# `run` commands get GATE_LEVEL, GATE_BASE and GATE_FILES (a file listing the changed paths).

[gate]
base = "main"                 # the branch pushes are compared against
on_commit_failure = "block"   # block | warn  (kb/setup.toml commit_failure)
commit_budget_seconds = 30
decisions_trailer = "present" # off | present | all: commits touching governed files say which decisions
ci_require_trailers = true    # CI fails when a commit in the push skipped the hooks
# protected = ["tools/kb/**", "kb/gate.toml", ...]   # changes need a `Gate-change:` trailer and show in the audit

[[check]]
name = "kb registry"
level = "commit"
builtin = "kb_check"

[[check]]
name = "whitespace"
level = "commit"
builtin = "whitespace"

[[check]]
name = "secrets"
level = "commit"
builtin = "secrets"
# args = { skip = ["tests/fixtures/**"], extra = { "internal token" = "\\bint_[a-z0-9]{32}\\b" } }

[[check]]
name = "personal data"
level = "commit"
builtin = "personal"          # terms in kb/local/personal.txt (untracked) never enter tracked files

[[check]]
name = "forbidden files"
level = "commit"
builtin = "forbidden"         # .env, keys, kb/local/**, plus the size cap from kb/setup.toml
# args = { globs = ["vendor/**"], max_file_kb = 5120 }

[[check]]
name = "local stays local"
level = "commit"
builtin = "local_ignored"

# --- project checks (proposed 2026-11-02 from the survey; times measured on the owner's Mac) ---
[[check]]
name = "migrations are append-only"
level = "commit"
builtin = "append_only"
args = { globs = ["engine/runtime/store/migrations/**"] }

[[check]]
name = "kb tool tests (historical and moved paths)"   # ~5 s: throwaway git repositories (PROJ-509, PROJ-511)
level = "commit"
# kb.py needs Python 3.11+ (tomllib), as tools/kb/run picks it
run = "for p in python3.14 python3.13 python3.12 python3.11 python3; do command -v $p >/dev/null && $p -c 'import tomllib' 2>/dev/null && { $p -I -B tools/kb/test_kb_historical.py || exit 1; exec $p -I -B tools/kb/test_kb_moved.py; }; done; echo 'needs Python 3.11 or newer' >&2; exit 1"
when = ["tools/kb/**", "kb/config.toml"]

[[check]]
name = "release tooling tests (scripts/tests)" # ~10-20 s: stdlib unittest, stubs for every signing tool (REL-426)
level = "push"
run = "/usr/bin/python3 -I -m unittest discover -s scripts/tests -t ."
when = ["scripts/**", "assets/**", "THIRD_PARTY_NOTICES.md", "package.json", "package-lock.json", "engine/packaging/**",
        "engine/Cargo.toml", "engine/crates/ferbd/src/**", "engine/crates/ferb-runtimes/src/**",
        "engine/crates/ferb-browser/src/**", "engine/crates/ferb-memory/src/embeddings.rs",
        "engine/crates/ferb-device/src/install.rs", "extension/manifest.json", "apps/mac/FERBNotch/Info.plist",
        "apps/mac/FERBAgent/**", "engine/runtime/**/*.md"]
timeout = 600

[[check]]
name = "Site tests (sign-in, download link, admin gate, public update feed)"   # under 1 s, no install
level = "commit"
run = "node --test site/tests/*.test.mjs"
when = ["site/**"]

[[check]]
name = "Swift tests (FERB.app)"              # ~20 s warm, minutes cold
level = "push"
run = "scripts/swift-test-gate.sh"   # names the failing tests last, where the gate shows them
when = ["apps/mac/FERBNotch/**"]
timeout = 1800

# --- Rust engine (area `engine`, ENG-1): when the engine or what it reads changes ---
[[check]]
name = "Rust format"                         # under 1 s
level = "commit"
run = "engine/gate.sh fmt"
when = ["engine/**"]

[[check]]
name = "Rust lint (clippy, warnings refused)"
level = "push"
run = "engine/gate.sh lint"
when = ["engine/**"]
timeout = 1800

[[check]]
name = "Rust foundation builds for iOS and Android"   # ENG-5: the engine crates, without the Mac platform crate
level = "push"
run = "engine/gate.sh portable"
when = ["engine/**"]
timeout = 1800

[[check]]
name = "Rust tests"
level = "push"
run = "engine/gate.sh test"
# engine/runtime/ (inside engine/): the runtime Markdown and migrations the engine reads; extension/: ferb-browser
# tests/extension_version.rs and extension_background.rs
when = ["engine/**", "extension/**"]
timeout = 2700

# --- the phone apps (area `phone`, stages 3 and 4): when an app or the Rust library both apps link changes ---
[[check]]
name = "Android app tests (design, core, app)"   # ~25 s warm; a Rust change rebuilds the phone library first (minutes)
level = "push"
# offline: the Gradle and Maven caches hold every dependency; the daemon is stopped whatever the result
run = "cd apps/android && ./gradlew --offline -q :design:test :core:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug; r=$?; ./gradlew --stop >/dev/null 2>&1; exit $r"
when = ["apps/android/**", "engine/crates/ferb-mobile/**", "engine/crates/ferb-mobile-ffi/**", "engine/crates/ferb-link/**",
        "engine/patches/**"]
timeout = 2400

[[check]]
name = "iPhone app builds and tests on the simulator"   # ~80 s warm; a Rust change rebuilds the phone library first
level = "push"
run = "apps/ios/tools/build.sh test"   # ad hoc signing, no team, SwiftPM anonymous (never the owner's keychain)
when = ["apps/ios/**", "engine/crates/ferb-mobile/**", "engine/crates/ferb-mobile-ffi/**", "engine/crates/ferb-link/**",
        "engine/patches/**"]
timeout = 2400

[[check]]
name = "live checks recorded"
level = "release"
builtin = "live_checks"
