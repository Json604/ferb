<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FERB</title>
<link rel="icon" href="/icon.png">
<style>
  :root { --fg: #f5f5f7; --muted: #a1a1a8; --bg: #0b0b0c; --dot: #f5a524; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; padding: 0 16px; text-align: center; }
  h1 { font-size: 64px; letter-spacing: -2px; margin: 0; }
  h1 span { color: var(--dot); }
  p { color: var(--muted); }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>ferb<span>.</span></h1>
  <p>An open-source personal assistant for macOS. It works in the background while you keep working, does tasks the
  way a person would, and gets better at the ones you repeat.</p>
  <p>Open source on 21 October 2026.</p>
  <p><a href="/privacy">Privacy policy</a></p>
</main>
</body>
</html>
