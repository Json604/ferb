<!doctype html>
<!-- Lab page: which fields are secret, by their structure only (HAND-515). Everyday fields whose words sound secret
     (a delivery pin code, a voucher's security code, a PIN-named search box) and the structural secret fields: a
     type=password labelled PIN, one a "show password" eye turned to text, a CSS-masked input, autocomplete tokens in
     any case and order, a 6-box code, card fields in a shadow root and in a cross-origin frame. labState() reads them. -->
<meta charset="utf-8">
<title>Secrets lab</title>
<style>body { font: 15px -apple-system, sans-serif; margin: 20px; } label { display: block; margin: 6px 0; }
  .boxes input { width: 2em; text-align: center; }</style>
<h1>Secrets lab</h1>
<label>Delivery pin code <input id="pincode" inputmode="numeric" maxlength="6"></label>
<label>Coupon security code (printed on the voucher) <input id="voucher"></label>
<label>Search by PIN or name <input id="pinsearch" name="pin"></label>
<label>Notes (one-time password reset notes) <div id="notes" contenteditable="true" role="textbox" aria-label="Notes"
  style="border:1px solid #999;min-height:2em"></div></label>
<label>PIN <input id="pinpw" type="password"></label>
<label>Password (with eye) <input id="eyepw" type="password"> <button type="button" id="eye">Show password</button></label>
<label>Masked by CSS <input id="cssmask" style="-webkit-text-security: disc"></label>
<label>Card number (upper case token) <input id="ccup" autocomplete="Shipping CC-Number"></label>
<label>Expiry month <input id="ccmonth" autocomplete="section-pay billing cc-exp-month"></label>
<label>Login code <input id="otc" autocomplete="one-time-code"></label>
<div class="boxes" aria-label="Six-box code">
  <input aria-label="Digit 1" maxlength="1" inputmode="numeric"><input aria-label="Digit 2" maxlength="1" inputmode="numeric"><input aria-label="Digit 3" maxlength="1" inputmode="numeric"><input aria-label="Digit 4" maxlength="1" inputmode="numeric"><input aria-label="Digit 5" maxlength="1" inputmode="numeric"><input aria-label="Digit 6" maxlength="1" inputmode="numeric">
</div>
<div id="host"></div>
<div id="framehost"></div>
<script>
  const $ = (s) => document.querySelector(s);
  $("#eye").onclick = () => { $("#eyepw").type = $("#eyepw").type === "password" ? "text" : "password"; };
  const root = $("#host").attachShadow({mode: "closed"});
  root.innerHTML = '<label>Shadow card number <input id="shcc" autocomplete="cc-number" aria-label="Shadow card number"></label>';
  const b = new URLSearchParams(location.search).get("b");
  if (b) $("#framehost").innerHTML = `<iframe title="Payment frame" width="420" height="60" src="${b}/frame-card.html"></iframe>`;
  window.labState = () => ({ready: true, ...Object.fromEntries(["pincode", "voucher", "pinsearch", "pinpw", "eyepw",
    "cssmask", "ccup", "ccmonth", "otc"].map((k) => [k, $("#" + k).value])), notes: $("#notes").innerText,
    boxes: [...document.querySelectorAll(".boxes input")].map((i) => i.value).join(""), eyeType: $("#eyepw").type,
    shadow: root.querySelector("input").value});
</script>
