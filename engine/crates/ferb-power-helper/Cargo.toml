[package]
name = "ferb-power-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "FERB's root helper (APP-986): a sleep-disable lease and FERB's own scheduled wakes, for ferbd only"

[lints]
workspace = true

[dependencies]
ferb-core = { path = "../ferb-core" }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ferb-platform-macos = { path = "../ferb-platform-macos" }
ferb-rpc = { path = "../ferb-rpc" }
libc.workspace = true

[[bin]]
name = "ferb-power"
path = "src/bin/ferb-power.rs"
